[package]
name = "nes-web"
version = "0.1.0"
edition = "2021"
# Pinned to the 1.92 toolchain (see rust-toolchain.toml) which webrtc 0.17.x requires.
rust-version = "1.92"

[dependencies]
# --- N64 emulation: load a libretro core (parallel_n64 / mupen64plus-next) via dlopen ---
libloading = "0.8"

# --- async runtime (shared by axum + webrtc-rs) ---
tokio = { version = "1", features = ["full"] }

# --- HTTP / signaling server ---
axum       = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }

# --- WebRTC (server side) ---
webrtc = "0.17.1"

# --- video encoding (VP8) -> binds SYSTEM libvpx via pkg-config ---
# `ffi-generate` is MANDATORY: env-libvpx-sys ships pre-generated bindings only up to
# libvpx 1.12/1.13, but this machine has 1.16.0. This feature runs bindgen at build time.
vpx-encode = { version = "0.6.2", features = ["ffi-generate"] }

# --- audio encoding (Opus) -> binds SYSTEM libopus via pkg-config ---
opus = "0.3.1"

# --- shared types / serialization / errors ---
bytes      = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"

# --- logging ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- DB (DB-agnostic: sqlite now, postgres later via DATABASE_URL only) ---
# runtime-tokio-rustls shares rustls 0.23 + ring 0.17 with webrtc (NO OpenSSL).
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }

# --- auth / session ---
argon2     = "0.5"   # Argon2id password hashing
rand       = "0.8"   # OsRng salt (rand_core 0.6) + slot-machine RNG + CPU move + tokens
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }  # matches axum 0.8
chrono     = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-trait = "0.1"
time       = "0.3"   # Cookie max_age (already in tree via webrtc)
futures-util = "0.3" # split() the axum WebSocket into sink+stream

[profile.release]
opt-level = 3
