<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED STADIUM ENGINE - Lobby</title>
  <style>
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }
    :root { --bg:#e9e7dd; --red:#e8403f; --parch:#ffffff; --ink:#000000; --inkdim:#666; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:"PokeRed", ui-monospace, "Courier New", monospace; font-size:16px; -webkit-font-smoothing:none; font-smooth:never;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:20px; }
    .balls { display:flex; align-items:center; gap:22px; }
    .pball { width:26px; height:26px; border-radius:50%; background:linear-gradient(#666 0 47%,#111 47% 53%,#fff 53% 100%); border:2px solid #0a0a0a; position:relative; }
    .pball::after { content:""; position:absolute; inset:0; margin:auto; width:7px; height:7px; background:#e9efe6; border:2px solid #0a0a0a; border-radius:50%; }
    .logo { font-family:"PokeRed", monospace; color:#8a8a8a; font-size:32px; letter-spacing:2px; image-rendering:pixelated;
      text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000, 4px 4px 0 #555; }
    .sub { color:#9a9a86; letter-spacing:4px; font-size:15px; margin-top:2px; }
    /* Game Boy cream box (real pokered frame) */
    .gb { background:var(--parch); color:var(--ink); position:relative; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; }
    .gb::after { content:none; }
    .who { margin-top:16px; padding:10px 22px; font-size:20px; letter-spacing:1px; }
    .who b { font-weight:400; }
    #find { width:min(86vw,460px); margin-top:14px; font-family:"PokeRed", monospace; font-size:22px;
      color:var(--ink); background:var(--parch); padding:20px 22px 20px 44px; cursor:pointer; letter-spacing:2px;
      display:flex; align-items:center; justify-content:flex-start; gap:12px; position:relative; }
    #find .cur { position:absolute; left:20px; }
    #find:hover { filter:brightness(1.04); }
    #find.searching { animation:bk 1s steps(2) infinite; }
    @keyframes bk { 50% { opacity:.55; } }
    .status { margin-top:16px; min-height:22px; color:var(--ink); text-align:center; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #bbb; border-top-color:#000; border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; }
    @keyframes s { to { transform:rotate(360deg); } }
    .links { margin-top:20px; font-size:18px; color:var(--inkdim); }
    .links a, .links span { color:#7c7c68; text-decoration:none; cursor:pointer; } .links a:hover,.links span:hover{color:var(--parch);}
  </style>
</head>
<body>
  <div class="balls"><span class="pball"></span><div class="logo">RED STADIUM ENGINE</div><span class="pball"></span></div>
  <div class="sub">- RANDOM BATTLE ARENA -</div>
  <div class="gb who" id="who">...</div>
  <button class="gb" id="find"><span class="cur">▶</span>FIND MATCH</button>
  <div class="status" id="status"></div>
  <div class="links"><a href="/console.html">DEV CONSOLE</a> - <span id="logout">LOGOUT</span></div>
  <script>
    const $ = (id) => document.getElementById(id);
    let ws, searching = false;
    (async () => {
      const r = await fetch("/api/me");
      if (r.status === 401) return location.replace("/login.html");
      const d = await r.json();
      if (d.room && d.room.id != null) return location.replace("/room.html?id=" + d.room.id);
      $("who").innerHTML = "TRAINER <b>" + d.user.username.toUpperCase() + "</b> - " + d.user.wins + "W / " + d.user.losses + "L";
      openWs();
    })();
    function openWs() {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === "queued") { searching = true; setSearching(m.position); }
        else if (m.type === "lobby") { searching = false; setIdle(); }
        else if (m.type === "matched") { $("status").innerHTML = "OPPONENT FOUND - ENTERING ARENA..."; setTimeout(() => location.replace("/room.html?id=" + m.room_id), 400); }
      };
      ws.onclose = () => { if (!searching) setIdle(); };
    }
    function setSearching(pos) { $("find").classList.add("searching"); $("find").innerHTML = '<span class="cur">▶</span>SEARCHING... (CANCEL)'; $("status").innerHTML = '<span class="spin"></span> WAITING FOR AN OPPONENT' + (pos > 1 ? " - #" + pos : ""); }
    function setIdle() { $("find").classList.remove("searching"); $("find").innerHTML = '<span class="cur">▶</span>FIND MATCH'; $("status").textContent = ""; }
    $("find").onclick = () => { if (!ws || ws.readyState !== 1) return; if (searching) { ws.send(JSON.stringify({ type: "cancel_queue" })); searching = false; setIdle(); } else ws.send(JSON.stringify({ type: "find_match" })); };
    $("logout").onclick = async () => { await fetch("/auth/logout", { method: "POST" }); location.replace("/login.html"); };
  </script>
</body>
</html>
