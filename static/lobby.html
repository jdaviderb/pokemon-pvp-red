  <style>
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }
    :root { --bg:#e9e7dd; --red:#e8403f; --parch:#ffffff; --ink:#000000; --inkdim:#666; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:"PokeRed", ui-monospace, "Courier New", monospace; font-size:16px; -webkit-font-smoothing:none; font-smooth:never;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:20px; }
    .balls { display:flex; align-items:center; gap:22px; }
    .pball { width:26px; height:26px; border-radius:50%; background:linear-gradient(#666 0 47%,#111 47% 53%,#fff 53% 100%); border:2px solid #0a0a0a; position:relative; }
    .pball::after { content:""; position:absolute; inset:0; margin:auto; width:7px; height:7px; background:#e9efe6; border:2px solid #0a0a0a; border-radius:50%; }
    .logo { font-family:"PokeRed", monospace; color:#8a8a8a; font-size:32px; letter-spacing:2px; image-rendering:pixelated;
      text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000, 4px 4px 0 #555; }
    .sub { color:#9a9a86; letter-spacing:4px; font-size:15px; margin-top:2px; }
    /* real Pokemon Red title look (matches login.html) */
    .logo-img { width:min(70vw,460px); height:auto; image-rendering:pixelated; }
    .verrow { display:flex; align-items:center; justify-content:center; gap:20px; margin:4px 0 6px; }
    .ver-txt { font-family:"PokeRed", monospace; font-size:24px; color:#000; letter-spacing:2px; image-rendering:pixelated; white-space:nowrap; }
    .red-img { width:min(12vw,68px); height:auto; image-rendering:pixelated; }
    /* Pokemon intro parade behind the lobby (changing mons) */
    .parade { position:fixed; left:0; right:0; bottom:0; height:58%; overflow:hidden; z-index:-1; pointer-events:none; }
    .parade img { position:absolute; bottom:-6%; left:0; height:min(46vh,300px); image-rendering:pixelated;
      filter:saturate(1.05) brightness(.7); opacity:.4; animation:parade 5s linear infinite; }
    .parade img.b { animation-delay:-2.5s; }
    @keyframes parade { from { transform:translateX(-34vw); } to { transform:translateX(132vw); } }
    /* Game Boy cream box (real pokered frame) */
    .gb { background:var(--parch); color:var(--ink); position:relative; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; }
    .gb::after { content:none; }
    .who { margin-top:16px; padding:10px 22px; font-size:20px; letter-spacing:1px; }
    .who b { font-weight:400; }
    #find { width:min(86vw,460px); margin-top:14px; font-family:"PokeRed", monospace; font-size:22px;
      color:var(--ink); background:var(--parch); padding:20px 22px 20px 44px; cursor:pointer; letter-spacing:2px;
      display:flex; align-items:center; justify-content:flex-start; gap:12px; position:relative; }
    #find .cur { position:absolute; left:20px; }
    #find:hover { filter:brightness(1.04); }
    #find.searching { animation:bk 1s steps(2) infinite; }
    @keyframes bk { 50% { opacity:.55; } }
    .status { margin-top:16px; min-height:22px; color:var(--ink); text-align:center; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #bbb; border-top-color:#000; border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; }
    @keyframes s { to { transform:rotate(360deg); } }
    .links { margin-top:20px; font-size:18px; color:var(--inkdim); }
    .links a, .links span { color:#7c7c68; text-decoration:none; cursor:pointer; } .links a:hover,.links span:hover{color:var(--parch);}

<body>

  <div class="parade"><img id="paradeMon" src="/sprites/94.png" alt="" /><img id="paradeMon2" class="b" src="/sprites/6.png" alt="" /></div>
  <img class="logo-img" src="/title/pokemon_logo.png" alt="Pokémon PVP Red — play Pokémon Red online" />
  <div class="verrow"><span class="ver-txt">PVP RED</span><img class="red-img" src="/title/player.png" alt="" /></div>
  <div class="gb who" id="who">...</div>
  <div id="charsel" style="display:none;width:min(92vw,560px);margin-top:10px">
    <div style="text-align:center;letter-spacing:2px;font-size:16px;margin-bottom:8px">PICK YOUR FIGHTER</div>
    <div id="csgrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div>
  </div>
  <button class="gb" id="find"><span class="cur">▶</span>FIND MATCH</button>
  <div class="status" id="status"></div>
  <div class="links"><a href="/ranking">LEADERBOARDS</a> - <a href="/collection">MY POKÉMON</a> - <a href="/tv">TV WALL</a> - <span id="mcplink" style="display:none"><a href="/agent">PLAY VIA AI (MCP)</a> - </span><span id="devlink" style="display:none"><a href="/console">DEV CONSOLE</a> - </span><span id="logout">LOG OUT</span></div>
  <script>
    const $ = (id) => document.getElementById(id);
    // presence heartbeat (server keys by account/cookie, so tabs/refreshes don't double-count)
    { const hb = () => fetch("/api/online").catch(() => {}); hb(); setInterval(hb, 5000); }
    // intro parade: each pass swaps to a random Gen-1 mon
    { const pick = () => "/sprites/" + (Math.floor(Math.random() * 151) + 1) + ".png";
      ["paradeMon", "paradeMon2"].forEach((id) => { const m = $(id); if (!m) return; m.src = pick(); m.addEventListener("animationiteration", () => (m.src = pick())); }); }
    let ws, searching = false, FIGHT = false, chosenChar = null; // chosenChar null = random
    const autofind = new URLSearchParams(location.search).has("find"); // guest flow lands here -> auto FIND MATCH
    // BR2 roster (index = the server's ROSTER order). Shown only in fight mode.
    const ROSTER = [
      {i:6,n:"YUGO",b:"WOLF"},{i:2,n:"ALICE",b:"RABBIT"},{i:5,n:"LONG",b:"TIGER"},
      {i:4,n:"BAKURYU",b:"MOLE"},{i:7,n:"STUN",b:"INSECT"},{i:8,n:"SHINA",b:"LEOPARD"},
      {i:1,n:"JENNY",b:"BAT"},{i:3,n:"URIKO",b:"½-BEAST"},{i:0,n:"BUSUZIMA",b:"CHAMELEON"},
    ];
    function buildCharSelect() {
      $("charsel").style.display = "";
      const g = $("csgrid"); g.innerHTML = "";
      const card = (label, sub, val) => {
        const el = document.createElement("button"); el.className = "gb csc"; el.dataset.val = (val===null?"r":val);
        el.style.cssText = "padding:8px 4px;font-size:13px;line-height:1.2;cursor:pointer;text-align:center";
        el.innerHTML = label + (sub?'<div style="font-size:10px;color:#7c7c68">'+sub+'</div>':'');
        el.onclick = () => { chosenChar = val; [...g.children].forEach(c=>c.style.outline=""); el.style.outline="3px solid #e8403f"; };
        return el;
      };
      g.appendChild(card("🎲 RANDOM","surprise",null));
      ROSTER.forEach(c => g.appendChild(card(c.n, c.b, c.i)));
      g.firstChild.click(); // default = random
    }
    (async () => {
      try { const c = await (await fetch("/api/config")).json(); FIGHT = !!c.fight; } catch (e) {}
      const r = await fetch("/api/me");
      if (r.status === 401) return location.replace("/login");
      const d = await r.json();
      // No trainer name yet (new Google user) -> must pick one first (the name-entry is on /login).
      if (d.user && d.user.name_chosen === false) return location.replace("/login");
      if (d.room && d.room.id != null) return location.replace("/room?id=" + d.room.id);
      if (d.dev) $("devlink").style.display = "";  // show the dev console link only in DEV mode
      if (!d.user.is_guest || d.dev) $("mcplink").style.display = "";  // agent mode: real accounts (or any in DEV)
      $("who").innerHTML = (FIGHT ? "FIGHTER <b>" : "TRAINER <b>") + d.user.username.toUpperCase() + "</b> - " + d.user.wins + "W / " + d.user.losses + "L";
      if (FIGHT) buildCharSelect();
      openWs();
    })();
    function openWs() {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
      ws.onopen = () => { if (autofind) { history.replaceState({}, "", "/lobby"); $("find").click(); } };
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === "queued") { searching = true; setSearching(m.position); }
        else if (m.type === "lobby") { searching = false; setIdle(); }
        else if (m.type === "matched") { $("status").innerHTML = "MATCHED vs " + String(m.opponent || "RIVAL").toUpperCase() + " &mdash; YOU ARE P" + m.seat; setTimeout(() => gbGo("/room?id=" + m.room_id), 1100); }
      };
      ws.onclose = () => { if (!searching) setIdle(); };
    }
    function setSearching(pos) { $("find").classList.add("searching"); $("find").innerHTML = '<span class="cur">▶</span>SEARCHING... (CANCEL)'; $("status").innerHTML = '<span class="spin"></span> WAITING FOR AN OPPONENT' + (pos > 1 ? " - #" + pos : ""); }
    function setIdle() { $("find").classList.remove("searching"); $("find").innerHTML = '<span class="cur">▶</span>FIND MATCH'; $("status").textContent = ""; }
    $("find").onclick = () => { if (!ws || ws.readyState !== 1) return;
      if (searching) { ws.send(JSON.stringify({ type: "cancel_queue" })); searching = false; setIdle(); }
      else { const msg = { type: "find_match" }; if (FIGHT && chosenChar != null) msg.char = chosenChar; ws.send(JSON.stringify(msg)); } };
    $("logout").onclick = async () => { await fetch("/auth/logout", { method: "POST" }); location.replace("/login"); };
  </script>
