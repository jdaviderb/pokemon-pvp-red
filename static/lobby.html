<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RETRO·VISION — Lobby</title>
  <style>
    :root { --bg:#0a0a0f; --panel:#14141c; --accent:#46e07f; --txt:#e8e8f0; --dim:#8a8aa0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--txt);
      background: radial-gradient(1200px 600px at 50% -10%, #1a1a2a 0%, var(--bg) 60%);
      font-family: ui-monospace, Menlo, monospace; }
    .card { width:min(92vw,440px); background:var(--panel); border:1px solid #262633;
      border-radius:16px; padding:28px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    h1 { margin:0 0 2px; font-size:20px; letter-spacing:1px; } h1 b { color:var(--accent); }
    .who { color:var(--dim); font-size:13px; margin-bottom:22px; }
    .who b { color:var(--txt); }
    button { padding:12px 18px; border-radius:10px; border:1px solid #2a2a38; background:#1c1c28;
      color:var(--txt); font:inherit; font-weight:700; cursor:pointer; }
    #find { width:100%; padding:18px; font-size:16px; background:var(--accent); color:#06120a;
      border-color:var(--accent); }
    #find:disabled { opacity:.5; cursor:default; }
    .status { margin-top:16px; min-height:18px; color:var(--accent); font-size:13px; }
    .links { margin-top:22px; font-size:12px; }
    .links a, .links span { color:var(--dim); text-decoration:none; cursor:pointer; }
    .links a:hover { color:var(--txt); }
  </style>
</head>
<body>
  <div class="card">
    <h1>RETRO·VISION <b>ARENA</b></h1>
    <div class="who" id="who">…</div>
    <button id="find">⚔  Find Match</button>
    <div class="status" id="status"></div>
    <div class="links">
      <a href="/console.html">dev console</a> · <span id="logout">logout</span>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    // Matchmaking gets wired to /ws in a later phase; for now just confirm session + show the user.
    (async () => {
      const r = await fetch("/api/me");
      if (r.status === 401) { location.replace("/login.html"); return; }
      const d = await r.json();
      if (d.room && d.room.id != null) { location.replace("/room.html?id=" + d.room.id); return; }
      $("who").innerHTML = "logged in as <b>" + d.user.username + "</b> · " +
        d.user.wins + "W / " + d.user.losses + "L";
    })();
    $("find").onclick = () => { $("status").textContent = "matchmaking arrives in the next build…"; };
    $("logout").onclick = async () => { await fetch("/auth/logout", { method: "POST" }); location.replace("/login.html"); };
  </script>
</body>
</html>
