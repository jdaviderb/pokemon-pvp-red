  <style>
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }

    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);

    .tvcell:hover { filter:brightness(.97); }
    .tvcell video { display:block; width:100%; aspect-ratio:160/144; object-fit:contain; background:#fff; image-rendering:pixelated; }
    .tvcell .lbl { position:absolute; left:0; right:0; bottom:0; padding:5px 8px; font-size:13px; letter-spacing:1px;

  <div class="head"><img class="logo-img" src="/title/pokemon_logo.png" alt="Pokémon PVP Red" /><div><div class="title">BATTLE WALL</div><div class="sub">- EVERY LIVE PVP BATTLE, ALL AT ONCE -</div></div></div>
  <div class="empty" id="empty">NO BATTLES LIVE RIGHT NOW.<br>Be the one who fires up the arena — hit PLAY.</div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager" style="display:none">
    <button class="pgbtn" id="prev">◀ PREV</button>
    <span class="pglabel" id="pglabel"></span>
    <button class="pgbtn" id="next">NEXT ▶</button>
  </div>
  <div class="links"><a href="/">◀ BACK TO THE ARENA</a></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const PAGE = 12;                // screens per page (each is a live WebRTC stream)
    const cells = new Map();        // id -> { el, pc }  (only the CURRENT page is rendered/streamed)
    let battles = [];               // full live list from /api/live (lightweight: just id/p1/p2)
    let page = 0;

    // Receive-only WebRTC to /offer?room=ID (the coordinator proxies to that battle's worker).
    async function connect(id, video) {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });
      const remote = new MediaStream(); video.srcObject = remote; pc.ontrack = (e) => remote.addTrack(e.track);
      await pc.setLocalDescription(await pc.createOffer());
      await new Promise((res) => {
        if (pc.iceGatheringState === "complete") return res();
        const c = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", c); res(); } };
        pc.addEventListener("icegatheringstatechange", c); setTimeout(res, 2500);
      });
      const r = await fetch("/offer?room=" + encodeURIComponent(id), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
      });
      if (!r.ok) { pc.close(); return null; }
      await pc.setRemoteDescription(await r.json());
      return pc;
    }

    function makeCell(b) {
      const el = document.createElement("div");
      el.className = "tvcell";
      el.innerHTML =
        '<video muted autoplay playsinline></video>' +
        '<div class="hint">WATCH ▶</div>' +
        '<div class="lbl"><span class="live">[LIVE]</span>' + (b.p1 || "P1").toUpperCase() + " vs " + (b.p2 || "P2").toUpperCase() + "</div>";
      el.onclick = () => (location.href = "/room?id=" + encodeURIComponent(b.id));
      return el;
    }

    // Render exactly the current page's battles as live cells; tear down everything off-page so we
    // never hold more than PAGE WebRTC streams at once (50+ concurrent battles won't melt the tab).
    function render() {
      const pages = Math.max(1, Math.ceil(battles.length / PAGE));
      if (page > pages - 1) page = pages - 1;
      if (page < 0) page = 0;
      const shown = battles.slice(page * PAGE, page * PAGE + PAGE);
      const ids = new Set(shown.map((b) => b.id));
      // drop cells not on this page (ended battles OR battles on another page) -> close their peers
      for (const [id, c] of cells) {
        if (!ids.has(id)) { if (c.pc) try { c.pc.close(); } catch (e) {} c.el.remove(); cells.delete(id); }
      }
      // add cells for this page's battles + start their streams
      for (const b of shown) {
        if (cells.has(b.id)) continue;
        const el = makeCell(b); $("grid").appendChild(el);
        const entry = { el, pc: null }; cells.set(b.id, entry);
        connect(b.id, el.querySelector("video")).then((pc) => { if (cells.has(b.id)) entry.pc = pc; }).catch(() => {});
      }
      $("empty").style.display = battles.length ? "none" : "";
      $("pager").style.display = battles.length > PAGE ? "flex" : "none";
      $("pglabel").textContent = "PAGE " + (page + 1) + " / " + pages + "  -  " + battles.length + " LIVE";
      $("prev").disabled = page <= 0;
      $("next").disabled = page >= pages - 1;
    }

    async function refresh() {
      try { battles = (await (await fetch("/api/live")).json()).battles || []; } catch (e) {}
      render();
    }
    $("prev").onclick = () => { page--; render(); };
    $("next").onclick = () => { page++; render(); };
    refresh();
    setInterval(refresh, 5000);
  </script>
