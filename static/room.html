<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED STADIUM ENGINE</title>
  <style>
    /* Real Game Boy font extracted from pret/pokered (local, offline, pixel-exact em=8). */
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }
    :root { --bg:#e9e7dd; --grn:#5ad17a; --grn-dim:#2c6e44; --red:#e8403f; --wht:#e9efe6; --txt:#000000;
      --dim:#666; --line:#000; --blue:#5aa9ff; --bluedim:#23507e; --reddim:#7a2422;
      --parch:#ffffff; --ink:#000000; --inkdim:#666; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--txt);
      font-family:"PokeRed", ui-monospace, "Courier New", monospace; font-size:16px; line-height:1.4; padding:9px;
      -webkit-font-smoothing:none; font-smooth:never;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; gap:8px; }
    #arena { flex:1; min-height:0; }
    .px { font-family:"PokeRed", ui-monospace, monospace; }
    .box { background:#ffffff; color:#000000; position:relative; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; }
    .box::after { content:none; }
    .pball { display:inline-block; width:20px; height:20px; border-radius:50%; background:linear-gradient(#666 0 47%,#111 47% 53%,#fff 53% 100%); border:2px solid #0a0a0a; position:relative; vertical-align:middle; }
    .pball::after { content:""; position:absolute; inset:0; margin:auto; width:6px; height:6px; background:#e9efe6; border:2px solid #0a0a0a; border-radius:50%; }

    /* header (image-18 style: title + meta row on the dark page, not boxed) */
    header.rse { max-width:900px; margin:0 auto; width:100%; text-align:center; }
    .rse-title { display:flex; align-items:center; justify-content:center; gap:16px; }
    .rse-title h1 { margin:0; color:var(--red); font-size:26px; letter-spacing:3px; text-shadow:2px 2px 0 #5a0f0e; }
    .rse-sub { color:#9a9a86; letter-spacing:4px; font-size:14px; margin-top:3px; }
    .rse-rule { border-top:1px solid #34342a; margin:9px 0; }
    .rse-meta { display:grid; grid-template-columns:1fr 1fr 1fr; color:#7c7c68; font-size:15px; letter-spacing:1px; }
    .rse-meta > div { border-left:1px solid #34342a; padding:2px 0; }
    .rse-meta > div:first-child { border-left:0; }
    .rse-meta b { display:block; color:#000; font-size:18px; margin-top:2px; }

    /* ---- SELECTION VIEW (slot machine - Game Boy cream) ---- */
    .phase-battle .selview { display:none; }
    .phase-slot   .battleview { display:none; }
    .selview { display:flex; flex-direction:column; gap:10px; max-width:900px; margin:0 auto; width:100%; }
    .srow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ptag { font-size:20px; letter-spacing:2px; padding:2px 4px 8px; border-bottom:2px solid #000000; margin-bottom:6px; }
    .uname { color:#5a563f; margin-left:8px; font-size:16px; }
    .reelbox { padding:12px 14px; display:grid; grid-template-columns:1fr 116px; gap:10px; align-items:center; }
    .reel .lbl { color:#5a563f; font-size:16px; letter-spacing:2px; }
    .rows { margin-top:4px; display:flex; flex-direction:column; }
    .rrow { display:flex; align-items:center; gap:8px; padding:1px 6px; color:#5a563f; opacity:.7; font-size:18px; border-radius:3px; }
    .rrow img { width:18px; height:18px; image-rendering:pixelated; filter:grayscale(1) contrast(1.1) brightness(.5); }
    .rrow .no { color:#7a755a; width:34px; }
    .rrow.hot { opacity:1; background:#000000; color:#ffffff; } .rrow.hot .no { color:#d8d8d0; }
    .spincol { text-align:center; }
    .spinner { width:76px; height:76px; margin:0 auto 6px; border-radius:50%;
      background:conic-gradient(#000000 0 25%, transparent 0 50%, #000000 0 75%, transparent 0); opacity:.9;
      border:3px solid #000000; animation:spin .6s linear infinite; }
    .stopped .spinner{ animation:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .progress { display:flex; gap:2px; margin-top:4px; } .progress i{flex:1;height:9px;background:#d8d8d0;border:1px solid #000000;}
    .progress i.on{background:#000000;}
    .spinlbl { color:#5a563f; font-size:15px; margin-top:4px; }

    .lockrow { display:grid; grid-template-columns:1fr 150px 1fr; gap:10px; align-items:stretch; }
    .lockcard { padding:12px 14px; display:grid; grid-template-columns:108px 1fr; gap:12px; align-content:center; }
    .bhpn { text-align:right; font-size:18px; margin-top:2px; }
    .lock { grid-column:1/-1; font-size:18px; letter-spacing:2px; color:#5a563f; }
    .locked .lock{ color:#000000; }
    .sprite { width:108px; height:108px; image-rendering:pixelated; align-self:center; filter:grayscale(1) contrast(1.12) brightness(.5); }
    .nm { font-size:19px; letter-spacing:0; }
    .lv { color:#5a563f; font-size:18px; }
    .badge { display:inline-block; font-size:15px; padding:1px 10px; border:2px solid #000000; border-radius:5px; margin:4px 0; letter-spacing:1px; color:#000000; }
    .hpline { font-size:16px; display:flex; align-items:center; gap:8px; margin-top:4px; }
    .hptrack { flex:1; max-width:220px; height:11px; background:#d8d8d0; border:2px solid #000000; border-radius:2px; overflow:hidden; }
    .hpfill { height:100%; width:100%; background:#000000; transition:width .4s; } .hpfill.low{background:#888;} .hpfill.crit{background:#333;}
    .vsbox { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
    .vs { font-size:54px; color:#000; text-shadow:none; }
    .startbox { padding:10px 16px; font-size:16px; color:#000000; letter-spacing:1px; text-align:center; }

    /* ---- BATTLE VIEW (classic Game Boy: cream boxes + ornate double border, monochrome) ---- */
    .battleview { display:flex; flex-direction:column; gap:10px; max-width:900px; margin:0 auto; width:100%; height:100%; }
    .gb { background:#ffffff; color:#000000; position:relative; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; }
    .gb::after { content:none; }
    .screen-box { padding:7px; flex:1 1 auto; min-height:0; }
    .screen { position:relative; height:100%; background:#ffffff; overflow:hidden; border-radius:8px; }
    video { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; background:#ffffff; display:block; }
    .screen::before { content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.16) 2px 3px); }
    #unmute { position:absolute; right:8px; bottom:8px; z-index:4; font:inherit; font-size:14px; background:#000000; color:#ffffff; border:0; border-radius:6px; padding:4px 9px; cursor:pointer; }
    .bz-row { display:grid; grid-template-columns:1.7fr 1fr; gap:10px; flex:0 0 auto; }
    /* move list (left) */
    .movelist { padding:14px 18px; display:flex; flex-direction:column; justify-content:space-evenly; }
    .mvrow { position:relative; display:flex; justify-content:space-between; align-items:center; gap:10px; white-space:nowrap; padding:4px 6px 4px 26px; font-size:18px; letter-spacing:0; cursor:default; border-radius:5px; }
    .mvrow .cur { position:absolute; left:8px; opacity:0; } .mvrow .pp { color:#3e3e2e; }
    .movelist.you .mvrow.live { cursor:pointer; }
    .movelist.you .mvrow.live:hover { background:#ededed; }
    .movelist.you .mvrow.live:first-child .cur { opacity:1; }
    .movelist.you:hover .mvrow.live:first-child .cur { opacity:0; }
    .movelist.you .mvrow.live:hover .cur { opacity:1; }
    .mvrow.dis { opacity:.4; }
    /* stat box (right = your active mon) */
    .statbox { padding:12px 18px; display:flex; flex-direction:column; gap:7px; }
    .sb-name { display:flex; justify-content:space-between; align-items:baseline; font-size:22px; letter-spacing:1px; }
    .sb-lv { font-size:18px; }
    .sb-hp { display:flex; align-items:center; gap:8px; font-size:18px; }
    .statbox .hptrack { flex:1; height:11px; background:#d8d8d0; border:2px solid #000000; border-radius:2px; max-width:none; }
    .statbox .hpfill { height:100%; width:100%; background:#000000; } .statbox .hpfill.low{background:#888;} .statbox .hpfill.crit{background:#333;}
    .sb-hpn { text-align:right; font-size:20px; }
    .statbox .badge { display:inline-block; font-size:15px; padding:2px 12px; border:2px solid #000000; border-radius:5px; background:transparent; color:#000000; letter-spacing:1px; }
    .statbox .sb-sprite { display:block; width:78px; height:78px; margin:auto auto 0; image-rendering:pixelated; filter:grayscale(1) contrast(1.12) brightness(.55); }
    .gb.myturn { box-shadow:0 0 0 3px #000, 0 0 0 6px #fff, 0 0 0 8px #000; }
    /* message box (bottom) */
    .msgbox { padding:12px 18px; font-size:18px; letter-spacing:0; display:flex; align-items:center; justify-content:space-between; gap:12px; flex:0 0 auto; }
    .msgbox .tmr { font-size:20px; color:#3e3e2e; } .msgbox .tmr.urgent { color:#333; }

    .overlay { position:fixed; inset:0; background:rgba(3,6,8,.93); display:grid; place-items:center; z-index:50; }
    .overlay.hidden { display:none; }
    .result { font-size:52px; text-shadow:3px 3px 0 #000; } .result.win{color:var(--grn);} .result.lose{color:var(--red);}
    #home { margin-top:20px; font-family:"Press Start 2P",monospace; font-size:14px; background:var(--grn); color:#06120a; border:0; border-radius:8px; padding:14px 22px; cursor:pointer; }
  </style>
</head>
<body>
  <header class="rse">
    <div class="rse-meta">
      <div>SEED<b id="seed">BATTLE_0000</b></div>
      <div>MODE<b>1 VS 1</b></div>
      <div>TURN<b id="turnNo">0</b></div>
    </div>
  </header>

  <main id="arena" class="phase-slot">
    <!-- ============ SELECTION (slot machine) ============ -->
    <div class="selview">
      <div class="srow">
        <div class="box p1box p1 reel reelbox stopped" id="reelbox1">
          <div><div class="lbl ptag">◖ PLAYER 1 ◗<span class="uname s1 uname">you</span></div>
            <div class="lbl" id="rlbl1">RANDOMIZING...</div><div class="rows" id="rows1"></div></div>
          <div class="spincol"><div class="spinner"></div><div class="progress" id="prog1"></div><div class="spinlbl" id="spin1">SPINNING...</div></div>
        </div>
        <div class="box p2box p2 reel reelbox stopped" id="reelbox2">
          <div><div class="lbl ptag">◖ PLAYER 2 ◗<span class="uname s2 uname">opp</span></div>
            <div class="lbl" id="rlbl2">RANDOMIZING...</div><div class="rows" id="rows2"></div></div>
          <div class="spincol"><div class="spinner"></div><div class="progress" id="prog2"></div><div class="spinlbl" id="spin2">SPINNING...</div></div>
        </div>
      </div>
      <div class="lockrow">
        <div class="box p1box p1 lockcard" id="lock1">
          <div class="lock" id="locklbl1">🔒 LOCKED</div>
          <img class="sprite s1 sprite" src="/sprites/1.png" alt="" />
          <div><div class="nm s1 name">-</div><div class="lv">Lv.<span id="lv1">50</span></div>
            <div class="badge s1 type">-</div>
            <div class="hpline">HP: <span class="hptrack"><span class="hpfill s1 hpfill"></span></span><span class="s1 hpnum"></span></div></div>
        </div>
        <div class="vsbox"><div class="vs" id="vs">VS</div><div class="box startbox" id="startbox">◖ START BATTLE ◗</div></div>
        <div class="box p2box p2 lockcard" id="lock2">
          <div class="lock" id="locklbl2">🔒 LOCKED</div>
          <img class="sprite s2 sprite" src="/sprites/1.png" alt="" />
          <div><div class="nm s2 name">-</div><div class="lv">Lv.<span id="lv2">50</span></div>
            <div class="badge s2 type">-</div>
            <div class="hpline">HP: <span class="hptrack"><span class="hpfill s2 hpfill"></span></span><span class="s2 hpnum"></span></div></div>
        </div>
      </div>
    </div>

    <!-- ============ BATTLE (classic Game Boy) ============ -->
    <div class="battleview">
      <div class="gb screen-box"><div class="screen" id="screenWrap"><video id="video" autoplay playsinline muted></video><button id="unmute">🔊 SOUND</button></div></div>
      <div class="bz-row">
        <div class="gb movelist you" id="movebar"></div>
        <div class="gb lockcard you" id="p1card">
          <div class="lock locked" id="p1lbl">🔒 LOCKED IN</div>
          <img class="sprite s1 sprite" src="/sprites/1.png" alt="" />
          <div>
            <div class="nm s1 name">-</div>
            <div class="lv">Lv.50</div>
            <div class="badge s1 type">-</div>
            <div class="hpline">HP: <span class="hptrack"><span class="hpfill s1 hpfill"></span></span></div>
            <div class="bhpn"><span class="s1 hpnum"></span></div>
          </div>
        </div>
      </div>
      <div class="gb msgbox"><span id="turnInfo">Choose your move.</span><span class="tmr" id="timer"></span></div>
    </div>
  </main>

  <div id="result" class="overlay hidden"><div style="text-align:center">
    <div class="result px" id="resultText">-</div><button id="home" class="px">RETURN HOME ▸</button></div></div>

  <script>
  const MOVE_NAMES = {1:"Pound",2:"Karate Chop",3:"DoubleSlap",4:"Comet Punch",5:"Mega Punch",6:"Pay Day",7:"Fire Punch",8:"Ice Punch",9:"ThunderPunch",10:"Scratch",11:"ViceGrip",12:"Guillotine",13:"Razor Wind",14:"Swords Dance",15:"Cut",16:"Gust",17:"Wing Attack",18:"Whirlwind",19:"Fly",20:"Bind",21:"Slam",22:"Vine Whip",23:"Stomp",24:"Double Kick",25:"Mega Kick",26:"Jump Kick",27:"Rolling Kick",28:"Sand-Attack",29:"Headbutt",30:"Horn Attack",31:"Fury Attack",32:"Horn Drill",33:"Tackle",34:"Body Slam",35:"Wrap",36:"Take Down",37:"Thrash",38:"Double-Edge",39:"Tail Whip",40:"Poison Sting",41:"Twineedle",42:"Pin Missile",43:"Leer",44:"Bite",45:"Growl",46:"Roar",47:"Sing",48:"Supersonic",49:"SonicBoom",50:"Disable",51:"Acid",52:"Ember",53:"Flamethrower",54:"Mist",55:"Water Gun",56:"Hydro Pump",57:"Surf",58:"Ice Beam",59:"Blizzard",60:"Psybeam",61:"BubbleBeam",62:"Aurora Beam",63:"Hyper Beam",64:"Peck",65:"Drill Peck",66:"Submission",67:"Low Kick",68:"Counter",69:"Seismic Toss",70:"Strength",71:"Absorb",72:"Mega Drain",73:"Leech Seed",74:"Growth",75:"Razor Leaf",76:"SolarBeam",77:"PoisonPowder",78:"Stun Spore",79:"Sleep Powder",80:"Petal Dance",81:"String Shot",82:"Dragon Rage",83:"Fire Spin",84:"ThunderShock",85:"Thunderbolt",86:"Thunder Wave",87:"Thunder",88:"Rock Throw",89:"Earthquake",90:"Fissure",91:"Dig",92:"Toxic",93:"Confusion",94:"Psychic",95:"Hypnosis",96:"Meditate",97:"Agility",98:"Quick Attack",99:"Rage",100:"Teleport",101:"Night Shade",102:"Mimic",103:"Screech",104:"Double Team",105:"Recover",106:"Harden",107:"Minimize",108:"SmokeScreen",109:"Confuse Ray",110:"Withdraw",111:"Defense Curl",112:"Barrier",113:"Light Screen",114:"Haze",115:"Reflect",116:"Focus Energy",117:"Bide",118:"Metronome",119:"Mirror Move",120:"Selfdestruct",121:"Egg Bomb",122:"Lick",123:"Smog",124:"Sludge",125:"Bone Club",126:"Fire Blast",127:"Waterfall",128:"Clamp",129:"Swift",130:"Skull Bash",131:"Spike Cannon",132:"Constrict",133:"Amnesia",134:"Kinesis",135:"Softboiled",136:"Hi Jump Kick",137:"Glare",138:"Dream Eater",139:"Poison Gas",140:"Barrage",141:"Leech Life",142:"Lovely Kiss",143:"Sky Attack",144:"Transform",145:"Bubble",146:"Dizzy Punch",147:"Spore",148:"Flash",149:"Psywave",150:"Splash",151:"Acid Armor",152:"Crabhammer",153:"Explosion",154:"Fury Swipes",155:"Bonemerang",156:"Rest",157:"Rock Slide",158:"Hyper Fang",159:"Sharpen",160:"Conversion",161:"Tri Attack",162:"Super Fang",163:"Slash",164:"Substitute",165:"Struggle"};
  const moveName = (id) => MOVE_NAMES[id] || ("#" + id);
  function moveIcon(name) {
    const n = name.toLowerCase();
    if (/thunder|shock|bolt/.test(n)) return "⚡";
    if (/recover|rest|softboiled|heal/.test(n)) return "✚";
    if (/psy|confus|hypno|dream|amnesia|mind|kinesis|barrier/.test(n)) return "👁";
    if (/fire|ember|flame|burn/.test(n)) return "🔥";
    if (/ice|blizzard|freeze|aurora/.test(n)) return "❄";
    if (/water|surf|hydro|bubble|clamp|crab/.test(n)) return "💧";
    if (/leaf|vine|seed|solar|petal|spore|powder|grow/.test(n)) return "🌿";
    if (/agility|quick|swords|sharpen|focus|defense|harden|withdraw|screech|double team|minimize/.test(n)) return "✦";
    return "▸";
  }
  const TYPE_COLOR = {NORMAL:"#a8a070",FIGHTING:"#c0573f",FLYING:"#7fa9d4",POISON:"#9d6fbf",GROUND:"#c9a86a",ROCK:"#a89060",BUG:"#9aab3a",GHOST:"#6a5a9a",FIRE:"#e08a4a",WATER:"#5a9fd4",GRASS:"#6fb04a",ELECTRIC:"#caa72e",PSYCHIC:"#d46fa0",ICE:"#6fc6d4",DRAGON:"#7a6fd4"};
  const TYPE_ICON  = {NORMAL:"●",FIGHTING:"✊",FLYING:"🪶",POISON:"☠",GROUND:"⛰",ROCK:"⛰",BUG:"🐛",GHOST:"👻",FIRE:"🔥",WATER:"💧",GRASS:"🌿",ELECTRIC:"⚡",PSYCHIC:"👁",ICE:"❄",DRAGON:"🐉"};
  const $ = (id) => document.getElementById(id);
  const setF = (side, field, txt) => document.querySelectorAll(".s" + side + "." + field).forEach((e) => (e.textContent = txt));
  const setSprite = (side, dex) => document.querySelectorAll(".s" + side + ".sprite").forEach((e) => (e.src = "/sprites/" + dex + ".png"));

  let ws, pc, mySeat = 0, timerHandle = null, resultShown = false, lastProgress = Date.now();
  let SP = {}, byDex = {}, allDex = [], lockedIdx = { 1:null, 2:null }, myMoves = null, reelsStarted = false, ppMax = {};

  async function connectVideo() {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver("video", { direction: "recvonly" }); pc.addTransceiver("audio", { direction: "recvonly" });
    const remote = new MediaStream(); $("video").srcObject = remote; pc.ontrack = (e) => remote.addTrack(e.track);
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await new Promise((res) => { if (pc.iceGatheringState === "complete") return res();
      const c=()=>{ if(pc.iceGatheringState==="complete"){pc.removeEventListener("icegatheringstatechange",c);res();} };
      pc.addEventListener("icegatheringstatechange", c); setTimeout(res, 2500); });
    const r = await fetch("/offer", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
    if (r.ok) await pc.setRemoteDescription(await r.json());
  }
  $("unmute").onclick = () => { $("video").muted = false; $("unmute").style.display = "none"; };

  function openWs() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => ws.send(JSON.stringify({ type: "resume" }));
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => setTimeout(openWs, 1500);
  }
  function handle(m) {
    if (["slot_result","battle_state","your_turn","room_state"].includes(m.type)) lastProgress = Date.now();
    switch (m.type) {
      case "room_state":
        mySeat = m.seat; setF(1,"uname",m.you.username.toUpperCase()); setF(2,"uname",m.opp.username.toUpperCase());
        $("lv1").textContent=m.level; $("lv2").textContent=m.level;
        $("seed").textContent = "BATTLE_" + String(m.room_id).padStart(4,"0");
        if (m.phase === "battle") {
          reelsStarted = true; // resuming into a live battle: reveal, don't re-roll
          if (m.you.species) lockCard(1, m.you.species);
          if (m.opp.species) lockCard(2, m.opp.species);
          setView("battle");
        } else if (m.you.species && m.opp.species) {
          maybeStartReels(m.you.species, m.opp.species); // pre-battle: run the roulette to the rolled mons
        }
        break;
      case "slot_result": maybeStartReels(m.you_species, m.opp_species); break;
      case "your_turn": {
        myMoves = m.moves || [];
        const mine = (lockedIdx[1] && SP[lockedIdx[1]]) ? SP[lockedIdx[1]].name : "your Pokémon";
        const opp = (lockedIdx[2] && SP[lockedIdx[2]]) ? SP[lockedIdx[2]].name : "the opponent";
        if (m.seat === mySeat) {
          renderMoves(myMoves, true); startTimer(m.deadline_ms);
          $("turnInfo").textContent = "YOUR TURN - choose " + mine + "'s move!";
          $("p1card").classList.add("myturn"); $("p1lbl").textContent = "▶ YOUR TURN";
        } else {
          $("turnInfo").textContent = "Opponent's " + opp + " is choosing...";
          $("p1card").classList.remove("myturn"); $("p1lbl").textContent = "🔒 LOCKED IN";
        }
        break;
      }
      case "battle_state": onBattle(m); break;
      case "move_auto": if (m.seat === mySeat) { $("turnInfo").textContent = "Time's up - random move chosen!"; $("p1card").classList.remove("myturn"); $("p1lbl").textContent = "🔒 LOCKED IN"; } break;
      case "winner": resultShown = true; showResult(m.you_won); break;
      case "room_closed": if (!resultShown) bail(m.reason === "battle_ended" ? "MATCH ENDED" : "MATCH COULDN'T START"); break;
    }
  }
  function setView(mode) { $("arena").className = "phase-" + mode; }

  // ---- reels ----
  function rrow(idx, hot) { const s = SP[idx]; if (!s) return "";
    return `<div class="rrow${hot?" hot":""}"><img src="/sprites/${s.dex}.png"/><span class="no">${String(s.dex).padStart(3,"0")}</span><span>${s.name}</span></div>`; }
  function paintReel(side, centerIdx, spinning) { const rows = $("rows"+side); const pick=[];
    for (let k=0;k<6;k++) pick.push(spinning?rand():(k===1?centerIdx:rand()));
    rows.innerHTML = pick.map((ix,k)=>rrow(ix,k===1)).join("");
    $("rlbl"+side).textContent = spinning?"RANDOMIZING...":"LOCKED IN ✓"; $("spin"+side).textContent = spinning?"SPINNING...":"■ LOCKED"; }
  function setProgress(side, frac){ const p=$("prog"+side); p.innerHTML=""; for(let i=0;i<10;i++){const e=document.createElement("i"); if(i/10<frac)e.className="on"; p.appendChild(e);} }
  function rand(){ return allDex.length?byDex[allDex[Math.floor(Math.random()*allDex.length)]]:1; }
  function maybeStartReels(youIdx, oppIdx) { if (reelsStarted || !SP[youIdx] || !SP[oppIdx]) return; reelsStarted = true; startReels(youIdx, oppIdx); }
  // roulette: set the big card sprite/name/type to a random species (NOT locked yet)
  function rollVisual(side, idx) { const s = SP[idx]; if (!s) return; setSprite(side, s.dex); setF(side, "name", s.name); setF(side, "type", s.types || "-"); }
  function startReels(youIdx, oppIdx) {
    $("reelbox1").classList.remove("stopped"); $("reelbox2").classList.remove("stopped"); $("startbox").textContent="◖ ROLLING... ◗";
    [1,2].forEach((s) => { $("lock"+s).classList.remove("locked"); $("locklbl"+s).textContent = "🎰 ROLLING..."; });
    let n=0; const total=28;
    const iv=setInterval(()=>{ n++;
      paintReel(1,youIdx,true); paintReel(2,oppIdx,true);
      rollVisual(1, rand()); rollVisual(2, rand());            // big card sprite/name spins too
      setProgress(1,n/total); setProgress(2,n/total);
      if(n>=total){ clearInterval(iv); paintReel(1,youIdx,false); paintReel(2,oppIdx,false); setProgress(1,1); setProgress(2,1);
        $("reelbox1").classList.add("stopped"); $("reelbox2").classList.add("stopped");
        lockCard(1,youIdx); lockCard(2,oppIdx); $("startbox").textContent="◖ BATTLE STARTING... ◗"; } }, 85);
  }

  function lockCard(side, idx) { lockedIdx[side]=idx; const s=SP[idx]; if(!s) return;
    setSprite(side, s.dex); setF(side,"name",s.name); setF(side,"type",s.types||"-");
    $("lock"+side).classList.add("locked"); $("locklbl"+side).textContent="🔓 LOCKED IN";
  }

  // move list (classic Gen-1 menu): NAME .... PP cur/max, with a ▶ cursor on hover
  function renderMoves(moves, live) {
    const box = $("movebar"); box.innerHTML = "";
    const list = (moves && moves.length) ? moves : (lockedIdx[1] && SP[lockedIdx[1]] ? SP[lockedIdx[1]].moves.map((id,i)=>({slot:i,id,pp:""})) : []);
    list.forEach((mv) => { if(!mv.id) return;
      if (live && mv.pp !== "") ppMax[mv.id] = Math.max(ppMax[mv.id]||0, mv.pp);
      const nm=moveName(mv.id); const pptxt = (mv.pp!=="" ? mv.pp+"/"+(ppMax[mv.id]||mv.pp) : "-");
      const row=document.createElement("div"); row.className="mvrow"+(live?" live":" dis"); row.dataset.slot=mv.slot;
      row.innerHTML = `<span class="cur">▶</span><span>${nm}</span><span class="pp">PP ${pptxt}</span>`;
      if (live) row.onclick=()=>{ if(!ws||ws.readyState!==1)return; ws.send(JSON.stringify({type:"commit_move",slot:mv.slot}));
        renderMoves(myMoves,false); stopTimer(); $("p1card").classList.remove("myturn"); $("turnInfo").textContent="Locked in - resolving..."; };
      box.appendChild(row); });
  }

  function onBattle(m) {
    setView("battle"); $("turnNo").textContent = (m.turn || 0);
    $("p1card").classList.remove("myturn"); $("p1lbl").textContent = "🔒 LOCKED IN";
    hpBar(1, m.you); hpBar(2, m.opp);
    if (m.you.species && SP[m.you.species]) lockCard(1, m.you.species);
    if (m.opp.species && SP[m.opp.species]) lockCard(2, m.opp.species);
    if (!myMoves) renderMoves(null, false);
  }
  function hpBar(side, mon) {
    const pct = mon.max_hp ? Math.max(0, Math.round((mon.hp/mon.max_hp)*100)) : 100;
    document.querySelectorAll(".s"+side+".hpfill").forEach((f)=>{ f.style.width=pct+"%"; f.className="hpfill s"+side+" hpfill "+(pct<=12?"crit":pct<=35?"low":""); });
    setF(side, "hpnum", mon.max_hp ? mon.hp+"/"+mon.max_hp : "");
  }
  function startTimer(ms){ stopTimer(); const end=Date.now()+(ms||15000);
    const upd=()=>{ const left=Math.max(0,(end-Date.now())/1000); $("timer").textContent="⏳ "+Math.ceil(left)+"s"; $("timer").classList.toggle("urgent",left<=5); if(left<=0){stopTimer(); renderMoves(myMoves,false);} };
    upd(); timerHandle=setInterval(upd,100); }
  function stopTimer(){ if(timerHandle)clearInterval(timerHandle); timerHandle=null; $("timer").textContent=""; $("timer").classList.remove("urgent"); }
  function showResult(youWon){ stopTimer(); $("resultText").textContent=youWon?"YOU WIN!":"YOU LOSE"; $("resultText").className="result px "+(youWon?"win":"lose"); $("result").classList.remove("hidden"); }
  function bail(msg){ resultShown=true; stopTimer(); $("resultText").textContent=msg; $("resultText").className="result px"; $("resultText").style.fontSize="26px"; $("result").classList.remove("hidden"); setTimeout(()=>location.replace("/lobby.html"),2300); }
  $("home").onclick = () => location.replace("/lobby.html");

  (async () => {
    const r = await fetch("/api/me"); if (r.status === 401) return location.replace("/login.html");
    const d = await r.json(); if (!d.room) return location.replace("/lobby.html");
    try { (await (await fetch("/api/species")).json()).forEach((s)=>{ SP[s.index]={dex:s.dex,name:s.name,types:s.types,moves:s.moves}; byDex[s.dex]=s.index; allDex.push(s.dex); }); } catch(e){}
    paintReel(1, rand(), true); paintReel(2, rand(), true);
    await connectVideo().catch(()=>{}); openWs();
    setInterval(()=>{ if(!resultShown && Date.now()-lastProgress>35000) bail("MATCH STALLED - RETURNING HOME"); }, 5000);
  })();
  </script>
</body>
</html>
