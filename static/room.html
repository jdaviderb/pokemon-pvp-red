<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED STADIUM ENGINE</title>
  <style>
    :root {
      --bg:#05080a; --panel:#0a1410; --line:#1f3a2c; --grn:#46e07f; --grn-dim:#2a7a4e;
      --blue:#5aa9ff; --blue-bg:#0a1422; --red:#ff5a5a; --red-bg:#1a0c0e; --txt:#cfeede; --dim:#5f8f73;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
      font-family: "Courier New", ui-monospace, Menlo, monospace; font-weight:700;
      letter-spacing:.5px; padding:14px; display:flex; flex-direction:column; gap:12px;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
    }
    .box { border:2px solid var(--line); border-radius:8px; background:var(--panel); position:relative; }
    .box::before, .box::after { content:""; position:absolute; width:9px; height:9px; border:2px solid var(--grn-dim); }
    .box::before { left:-2px; top:-2px; border-right:0; border-bottom:0; }
    .box::after  { right:-2px; bottom:-2px; border-left:0; border-top:0; }
    h1 { margin:0; font-size:30px; color:var(--red); letter-spacing:3px; text-shadow:0 0 10px rgba(255,90,90,.4); }
    .pball { display:inline-block; width:22px; height:22px; border-radius:50%;
      background:linear-gradient(#ff4d4d 0 50%, #fff 50% 100%); border:2px solid #111;
      box-shadow:0 0 0 2px #111 inset; vertical-align:middle; position:relative; }
    .pball::after { content:""; position:absolute; left:50%; top:50%; width:6px; height:6px;
      transform:translate(-50%,-50%); background:#fff; border:2px solid #111; border-radius:50%; }

    /* header */
    .hdr { display:grid; grid-template-columns:200px 1fr 200px; gap:12px; align-items:stretch; }
    .hdr .cell { padding:8px 12px; font-size:11px; color:var(--dim); }
    .hdr .cell b { color:var(--grn); font-size:14px; }
    .hdr .title { text-align:center; padding:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .hdr .title .row { display:flex; align-items:center; gap:14px; }
    .hdr .sub { color:var(--grn); font-size:12px; letter-spacing:2px; }

    /* arena: P1 | center | P2 */
    .arena { display:grid; grid-template-columns:1fr 280px 1fr; gap:12px; align-items:start; }
    @media (max-width:1000px){ .arena { grid-template-columns:1fr; } .center{order:-1;} }
    .side { display:flex; flex-direction:column; gap:10px; }
    .ptag { font-size:15px; letter-spacing:2px; padding:6px 12px; }
    .p1 .ptag, .p1 .box.acc { color:var(--blue); }
    .p2 .ptag, .p2 .box.acc { color:var(--red); }
    .p1 .box.acc { border-color:#1d3a5c; } .p2 .box.acc { border-color:#5c1d22; }
    .p1 .uname { color:var(--blue); } .p2 .uname { color:var(--red); }
    .uname { font-size:12px; color:var(--dim); margin-left:auto; }

    /* reel */
    .reel { padding:10px 12px; }
    .reel .rl { display:flex; align-items:center; justify-content:space-between; font-size:12px; }
    .reel .rl .lbl { color:var(--dim); letter-spacing:2px; }
    .rows { margin-top:8px; display:flex; flex-direction:column; gap:2px; min-height:120px; }
    .row { display:flex; align-items:center; gap:8px; font-size:13px; padding:2px 6px; color:#8fbfa3; opacity:.6; }
    .row img { width:18px; height:18px; image-rendering:pixelated; }
    .row .no { color:var(--dim); width:32px; }
    .row.hot { opacity:1; background:rgba(70,224,127,.12); border-radius:4px; }
    .p1 .row.hot { background:rgba(90,169,255,.15); color:#cfe6ff; }
    .p2 .row.hot { background:rgba(255,90,90,.15); color:#ffd6d6; }
    .progress { margin-top:8px; height:10px; display:flex; gap:2px; }
    .progress i { flex:1; background:#0e2018; border:1px solid var(--line); border-radius:1px; }
    .p1 .progress i.on { background:var(--blue); } .p2 .progress i.on { background:var(--red); }
    .spin { color:var(--dim); font-size:11px; text-align:right; margin-top:4px; }

    /* card */
    .card { padding:12px; display:grid; grid-template-columns:104px 1fr; gap:12px; }
    .card .lock { grid-column:1/-1; font-size:12px; letter-spacing:2px; color:var(--dim); display:flex; align-items:center; gap:6px; }
    .card.locked .lock { color:var(--grn); }
    .card .sprite { width:104px; height:104px; image-rendering:pixelated; align-self:center;
      filter:grayscale(1) brightness(1.6) sepia(.5) hue-rotate(70deg) saturate(1.4); }
    .p2 .card .sprite { filter:grayscale(1) brightness(1.5) sepia(.5) hue-rotate(-30deg) saturate(2); }
    .card .nm { font-size:20px; letter-spacing:1px; color:#eafff2; }
    .card .lv { font-size:13px; color:var(--dim); }
    .badge { display:inline-block; font-size:11px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; margin:4px 0; }
    .p1 .badge { color:var(--blue); border-color:#1d3a5c; } .p2 .badge { color:var(--red); border-color:#5c1d22; }
    .hpline { font-size:12px; display:flex; align-items:center; gap:8px; }
    .hptrack { flex:1; height:9px; background:#0e2018; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
    .hpfill { height:100%; width:100%; background:var(--grn); transition:width .4s; }
    .hpfill.low{background:#e0c64b;} .hpfill.crit{background:var(--red);}
    .moves { grid-column:1/-1; margin-top:4px; }
    .moves .mt { font-size:11px; color:var(--dim); letter-spacing:2px; margin-bottom:4px; }
    .mv { display:block; width:100%; text-align:left; font:inherit; color:#bfe6d0; background:transparent;
      border:1px solid transparent; border-radius:5px; padding:5px 8px; font-size:13px; }
    .you .mv.live { border-color:var(--grn-dim); cursor:pointer; color:#eafff2; }
    .you .mv.live:hover { background:rgba(70,224,127,.15); border-color:var(--grn); }
    .mv:disabled { cursor:default; }
    .mv .n { color:var(--dim); margin-right:8px; }

    /* center column */
    .center { display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:34px; }
    .vs { font-size:54px; color:var(--grn); text-shadow:0 0 16px rgba(70,224,127,.5); letter-spacing:2px; }
    .screen { width:100%; aspect-ratio:160/144; background:#000; border:2px solid var(--line); border-radius:8px; overflow:hidden; display:none; }
    .screen.on { display:block; }
    video { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; background:#9bbc0f; }
    .turnbar { text-align:center; font-size:13px; min-height:20px; }
    #timer { font-size:26px; color:var(--grn); } #timer.urgent{color:var(--red);}
    .startline { font-size:12px; color:var(--grn); letter-spacing:2px; min-height:16px; text-align:center; }
    #unmute { font-size:11px; background:#0e2018; color:var(--grn); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-family:inherit; }

    .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(3,6,8,.92); z-index:50; }
    .overlay.hidden { display:none; }
    .rcard { text-align:center; }
    .result { font-size:48px; font-weight:900; letter-spacing:4px; }
    .result.win{color:var(--grn);} .result.lose{color:var(--red);}
    #home { margin-top:18px; font:inherit; font-weight:800; padding:13px 26px; border-radius:8px;
      background:var(--grn); color:#06120a; border:2px solid var(--grn); cursor:pointer; letter-spacing:1px; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="hdr">
    <div class="box cell seed">▸ SEED<br><b id="seed">BATTLE_0000</b></div>
    <div class="box title">
      <div class="row"><span class="pball"></span><h1>RED STADIUM ENGINE</h1><span class="pball"></span></div>
      <div class="sub">▸▸▸ RANDOM BATTLE ARENA ◂◂◂</div>
    </div>
    <div class="box cell mode" style="text-align:right">MODE ◂<br><b>1 VS 1</b><br>LEVEL CAP: <span id="lvcap">50</span></div>
  </header>

  <!-- ARENA -->
  <main class="arena">
    <section class="side p1 you">
      <div class="ptag">◖ PLAYER 1 ◗ <span class="uname" id="u1">you</span></div>
      <div class="box acc reel" id="reel1">
        <div class="rl"><span class="lbl" id="rlbl1">RANDOMIZING…</span></div>
        <div class="rows" id="rows1"></div>
        <div class="progress" id="prog1"></div>
        <div class="spin" id="spin1">SPINNING…</div>
      </div>
      <div class="box acc card" id="card1">
        <div class="lock" id="lock1">🔒 LOCKED</div>
        <img class="sprite" id="sprite1" src="/sprites/1.png" alt="" />
        <div>
          <div class="nm" id="nm1">—</div>
          <div class="lv">Lv.<span id="lv1">50</span></div>
          <div class="badge" id="ty1">—</div>
          <div class="hpline">HP: <span class="hptrack"><span class="hpfill" id="hp1"></span></span><span id="hpn1"></span></div>
        </div>
        <div class="moves"><div class="mt">MOVES</div><div id="mv1"></div></div>
      </div>
    </section>

    <section class="center">
      <div class="vs" id="vs">VS</div>
      <div class="screen" id="screenWrap"><video id="video" autoplay playsinline muted></video></div>
      <div class="turnbar"><div id="turnInfo">connecting…</div><div id="timer"></div></div>
      <div class="startline" id="startLine"></div>
      <button id="unmute">🔊 SOUND</button>
    </section>

    <section class="side p2 opp">
      <div class="ptag" style="justify-content:flex-end;display:flex">◖ PLAYER 2 ◗ <span class="uname" id="u2">opponent</span></div>
      <div class="box acc reel" id="reel2">
        <div class="rl"><span class="lbl" id="rlbl2">RANDOMIZING…</span></div>
        <div class="rows" id="rows2"></div>
        <div class="progress" id="prog2"></div>
        <div class="spin" id="spin2">SPINNING…</div>
      </div>
      <div class="box acc card" id="card2">
        <div class="lock" id="lock2">🔒 LOCKED</div>
        <img class="sprite" id="sprite2" src="/sprites/1.png" alt="" />
        <div>
          <div class="nm" id="nm2">—</div>
          <div class="lv">Lv.<span id="lv2">50</span></div>
          <div class="badge" id="ty2">—</div>
          <div class="hpline">HP: <span class="hptrack"><span class="hpfill" id="hp2"></span></span><span id="hpn2"></span></div>
        </div>
        <div class="moves"><div class="mt">MOVES</div><div id="mv2"></div></div>
      </div>
    </section>
  </main>

  <div id="result" class="overlay hidden"><div class="rcard">
    <div class="result" id="resultText">—</div><button id="home">RETURN HOME ▸</button>
  </div></div>

  <script>
  const MOVE_NAMES = {1:"Pound",2:"Karate Chop",3:"DoubleSlap",4:"Comet Punch",5:"Mega Punch",6:"Pay Day",7:"Fire Punch",8:"Ice Punch",9:"ThunderPunch",10:"Scratch",11:"ViceGrip",12:"Guillotine",13:"Razor Wind",14:"Swords Dance",15:"Cut",16:"Gust",17:"Wing Attack",18:"Whirlwind",19:"Fly",20:"Bind",21:"Slam",22:"Vine Whip",23:"Stomp",24:"Double Kick",25:"Mega Kick",26:"Jump Kick",27:"Rolling Kick",28:"Sand-Attack",29:"Headbutt",30:"Horn Attack",31:"Fury Attack",32:"Horn Drill",33:"Tackle",34:"Body Slam",35:"Wrap",36:"Take Down",37:"Thrash",38:"Double-Edge",39:"Tail Whip",40:"Poison Sting",41:"Twineedle",42:"Pin Missile",43:"Leer",44:"Bite",45:"Growl",46:"Roar",47:"Sing",48:"Supersonic",49:"SonicBoom",50:"Disable",51:"Acid",52:"Ember",53:"Flamethrower",54:"Mist",55:"Water Gun",56:"Hydro Pump",57:"Surf",58:"Ice Beam",59:"Blizzard",60:"Psybeam",61:"BubbleBeam",62:"Aurora Beam",63:"Hyper Beam",64:"Peck",65:"Drill Peck",66:"Submission",67:"Low Kick",68:"Counter",69:"Seismic Toss",70:"Strength",71:"Absorb",72:"Mega Drain",73:"Leech Seed",74:"Growth",75:"Razor Leaf",76:"SolarBeam",77:"PoisonPowder",78:"Stun Spore",79:"Sleep Powder",80:"Petal Dance",81:"String Shot",82:"Dragon Rage",83:"Fire Spin",84:"ThunderShock",85:"Thunderbolt",86:"Thunder Wave",87:"Thunder",88:"Rock Throw",89:"Earthquake",90:"Fissure",91:"Dig",92:"Toxic",93:"Confusion",94:"Psychic",95:"Hypnosis",96:"Meditate",97:"Agility",98:"Quick Attack",99:"Rage",100:"Teleport",101:"Night Shade",102:"Mimic",103:"Screech",104:"Double Team",105:"Recover",106:"Harden",107:"Minimize",108:"SmokeScreen",109:"Confuse Ray",110:"Withdraw",111:"Defense Curl",112:"Barrier",113:"Light Screen",114:"Haze",115:"Reflect",116:"Focus Energy",117:"Bide",118:"Metronome",119:"Mirror Move",120:"Selfdestruct",121:"Egg Bomb",122:"Lick",123:"Smog",124:"Sludge",125:"Bone Club",126:"Fire Blast",127:"Waterfall",128:"Clamp",129:"Swift",130:"Skull Bash",131:"Spike Cannon",132:"Constrict",133:"Amnesia",134:"Kinesis",135:"Softboiled",136:"Hi Jump Kick",137:"Glare",138:"Dream Eater",139:"Poison Gas",140:"Barrage",141:"Leech Life",142:"Lovely Kiss",143:"Sky Attack",144:"Transform",145:"Bubble",146:"Dizzy Punch",147:"Spore",148:"Flash",149:"Psywave",150:"Splash",151:"Acid Armor",152:"Crabhammer",153:"Explosion",154:"Fury Swipes",155:"Bonemerang",156:"Rest",157:"Rock Slide",158:"Hyper Fang",159:"Sharpen",160:"Conversion",161:"Tri Attack",162:"Super Fang",163:"Slash",164:"Substitute",165:"Struggle"};
  const moveName = (id) => MOVE_NAMES[id] || ("#" + id);
  const $ = (id) => document.getElementById(id);

  let ws, pc, mySeat = 0, timerHandle = null, resultShown = false, lastProgress = Date.now();
  let SP = {};            // internal index -> {dex,name,types,moves[]}
  let byDex = {};         // dex -> index
  const allDex = [];      // [1..151]
  let lockedIdx = { 1: null, 2: null };
  let myMoves = null;     // live move slots when it's my turn

  // ---- WebRTC: shared room stream ----
  async function connectVideo() {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    const remote = new MediaStream();
    $("video").srcObject = remote;
    pc.ontrack = (e) => remote.addTrack(e.track);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise((res) => {
      if (pc.iceGatheringState === "complete") return res();
      const c = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", c); res(); } };
      pc.addEventListener("icegatheringstatechange", c); setTimeout(res, 2500);
    });
    const r = await fetch("/offer", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
    if (r.ok) await pc.setRemoteDescription(await r.json());
  }
  $("unmute").onclick = () => { $("video").muted = false; $("unmute").style.display = "none"; };

  // ---- WebSocket ----
  function openWs() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => ws.send(JSON.stringify({ type: "resume" }));
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => setTimeout(openWs, 1500);
  }

  function handle(m) {
    if (["slot_result","battle_state","your_turn","room_state"].includes(m.type)) lastProgress = Date.now();
    switch (m.type) {
      case "room_state":
        mySeat = m.seat;
        $("u1").textContent = m.you.username; $("u2").textContent = m.opp.username;
        $("lvcap").textContent = m.level; $("lv1").textContent = m.level; $("lv2").textContent = m.level;
        $("seed").textContent = "BATTLE_" + String(m.room_id).padStart(4, "0");
        if (m.you.species) lockCard(1, m.you.species);
        if (m.opp.species) lockCard(2, m.opp.species);
        $("vs").textContent = m.phase === "battle" ? "⚔" : "VS";
        break;
      case "slot_result":
        startReels(m.you_species, m.opp_species); break;
      case "your_turn":
        myMoves = m.moves || [];
        if (m.seat === mySeat) { enableMyMoves(true); startTimer(m.deadline_ms); $("turnInfo").textContent = "▸ YOUR MOVE — choose!"; }
        else { $("turnInfo").textContent = "opponent is choosing…"; }
        break;
      case "battle_state": onBattle(m); break;
      case "move_auto": if (m.seat === mySeat) $("turnInfo").textContent = "time up — random move!"; break;
      case "winner": resultShown = true; showResult(m.you_won); break;
      case "room_closed": if (!resultShown) bail(m.reason === "battle_ended" ? "MATCH ENDED" : "MATCH COULDN'T START"); break;
    }
  }

  // ---- slot machine reels ----
  function rowHtml(idx, hot) {
    const s = SP[idx]; if (!s) return "";
    return `<div class="row${hot ? " hot" : ""}"><img src="/sprites/${s.dex}.png"/><span class="no">${String(s.dex).padStart(3,"0")}</span><span>${s.name}</span></div>`;
  }
  function paintReel(side, centerIdx, spinning) {
    const rows = $("rows" + side);
    const pick = [];
    for (let k = 0; k < 6; k++) pick.push(spinning ? rand() : (k === 1 ? centerIdx : rand()));
    rows.innerHTML = pick.map((ix, k) => rowHtml(ix, k === 1)).join("");
    $("rlbl" + side).textContent = spinning ? "RANDOMIZING…" : "LOCKED IN ✓";
    $("spin" + side).textContent = spinning ? "SPINNING…" : "■ LOCKED";
  }
  function setProgress(side, frac) {
    const p = $("prog" + side); p.innerHTML = "";
    for (let i = 0; i < 10; i++) { const e = document.createElement("i"); if (i / 10 < frac) e.className = "on"; p.appendChild(e); }
  }
  function rand() { return allDex.length ? byDex[allDex[Math.floor(Math.random() * allDex.length)]] : 1; }

  function startReels(youIdx, oppIdx) {
    $("startLine").textContent = "ROLLING FIGHTERS…";
    let n = 0; const total = 26;
    const iv = setInterval(() => {
      n++;
      paintReel(1, youIdx, true); paintReel(2, oppIdx, true);
      setProgress(1, n / total); setProgress(2, n / total);
      if (n >= total) {
        clearInterval(iv);
        paintReel(1, youIdx, false); paintReel(2, oppIdx, false);
        setProgress(1, 1); setProgress(2, 1);
        lockCard(1, youIdx); lockCard(2, oppIdx);
        $("startLine").textContent = "● BATTLE STARTING…";
      }
    }, 85);
  }

  // ---- locked card ----
  function lockCard(side, idx) {
    lockedIdx[side] = idx;
    const s = SP[idx]; if (!s) return;
    $("sprite" + side).src = "/sprites/" + s.dex + ".png";
    $("nm" + side).textContent = s.name;
    $("ty" + side).textContent = s.types || "—";
    $("card" + side).classList.add("locked");
    $("lock" + side).innerHTML = "🔓 LOCKED IN";
    renderMoves(side, s.moves, /*live=*/false);
  }

  function renderMoves(side, moveIds, live) {
    const box = $("mv" + side); box.innerHTML = "";
    (moveIds || []).forEach((id, i) => {
      if (!id) return;
      const b = document.createElement("button");
      b.className = "mv"; b.dataset.slot = i; b.disabled = true;
      b.innerHTML = `<span class="n">${i + 1}.</span>${moveName(id)}`;
      if (side === 1 && live) {
        b.classList.add("live"); b.disabled = false;
        b.onclick = () => {
          if (!ws || ws.readyState !== 1) return;
          ws.send(JSON.stringify({ type: "commit_move", slot: i }));
          enableMyMoves(false); stopTimer(); $("turnInfo").textContent = "locked in — resolving…";
        };
      }
      box.appendChild(b);
    });
  }
  function enableMyMoves(on) {
    if (!lockedIdx[1]) return;
    renderMoves(1, SP[lockedIdx[1]] ? SP[lockedIdx[1]].moves : [], on);
  }

  // ---- battle ----
  function onBattle(m) {
    $("screenWrap").classList.add("on"); $("vs").style.display = "none";
    $("startLine").textContent = "";
    $("turnInfo").dataset.turn = m.turn;
    hpBar(1, m.you); hpBar(2, m.opp);
    if (m.you.species && SP[m.you.species]) lockCard(1, m.you.species);
    if (m.opp.species && SP[m.opp.species]) lockCard(2, m.opp.species);
  }
  function hpBar(side, mon) {
    const pct = mon.max_hp ? Math.max(0, Math.round((mon.hp / mon.max_hp) * 100)) : 100;
    const f = $("hp" + side); f.style.width = pct + "%";
    f.className = "hpfill" + (pct <= 12 ? " crit" : pct <= 35 ? " low" : "");
    $("hpn" + side).textContent = mon.max_hp ? mon.hp + "/" + mon.max_hp : "";
  }

  // ---- timer ----
  function startTimer(ms) {
    stopTimer(); const end = Date.now() + (ms || 15000);
    const upd = () => { const left = Math.max(0, (end - Date.now()) / 1000);
      $("timer").textContent = left.toFixed(0) + "s"; $("timer").classList.toggle("urgent", left <= 5);
      if (left <= 0) { stopTimer(); enableMyMoves(false); } };
    upd(); timerHandle = setInterval(upd, 100);
  }
  function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; $("timer").textContent = ""; $("timer").classList.remove("urgent"); }

  // ---- result ----
  function showResult(youWon) {
    enableMyMoves(false); stopTimer();
    $("resultText").textContent = youWon ? "YOU WIN!" : "YOU LOSE";
    $("resultText").className = "result " + (youWon ? "win" : "lose");
    $("result").classList.remove("hidden");
  }
  function bail(msg) {
    resultShown = true; enableMyMoves(false); stopTimer();
    $("resultText").textContent = msg; $("resultText").className = "result";
    $("resultText").style.fontSize = "26px"; $("result").classList.remove("hidden");
    setTimeout(() => location.replace("/lobby.html"), 2300);
  }
  $("home").onclick = () => location.replace("/lobby.html");

  // ---- boot ----
  (async () => {
    const r = await fetch("/api/me");
    if (r.status === 401) return location.replace("/login.html");
    const d = await r.json();
    if (!d.room) return location.replace("/lobby.html");
    try {
      (await (await fetch("/api/species")).json()).forEach((s) => {
        SP[s.index] = { dex: s.dex, name: s.name, types: s.types, moves: s.moves };
        byDex[s.dex] = s.index; allDex.push(s.dex);
      });
    } catch (e) {}
    // initial reels (placeholder spin look)
    paintReel(1, rand(), true); paintReel(2, rand(), true);
    await connectVideo().catch(() => {});
    openWs();
    setInterval(() => { if (!resultShown && Date.now() - lastProgress > 35000) bail("MATCH STALLED — RETURNING HOME"); }, 5000);
  })();
  </script>
</body>
