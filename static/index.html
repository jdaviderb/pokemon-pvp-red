<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RETRO·VISION ARENA</title>
  <style>
    body { margin:0; height:100vh; display:grid; place-items:center; background:#0a0a0f;
      color:#8a8aa0; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <div>loading…</div>
  <script>
    // First-paint router: no session -> login; in a room -> back into that room; else -> lobby.
    (async () => {
      try {
        const r = await fetch("/api/me");
        if (r.status === 401) { location.replace("/login.html"); return; }
        const d = await r.json();
        if (d.room && d.room.id != null) { location.replace("/room.html?id=" + d.room.id); return; }
        location.replace("/lobby.html");
      } catch (e) { location.replace("/login.html"); }
    })();
  </script>
</body>
</html>
