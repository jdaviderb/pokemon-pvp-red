<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMASH·O·VISION 64 — server-side emulation over WebRTC</title>
  <style>
    :root {
      color-scheme: dark;
      --w: min(90vw, 940px);   /* TV screen width; height is 4:3 */
      --accent: #58e08a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 28px 16px;
      color: #d7d7e2;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      /* dark room with a warm glow behind the set */
      background:
        radial-gradient(120% 90% at 50% 18%, #1a1622 0%, #0c0b12 45%, #050509 100%),
        #050509;
    }

    /* ---------------- the television ---------------- */
    .tv { width: var(--w); display: flex; flex-direction: column; align-items: center; }

    .cabinet {
      width: 100%;
      padding: 26px 26px 18px;
      border-radius: 26px;
      background:
        linear-gradient(180deg, #3a3a42 0%, #26262d 9%, #1c1c22 70%, #141418 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.10),
        inset 0 -8px 22px rgba(0,0,0,.6),
        0 40px 70px -25px rgba(0,0,0,.85),
        0 0 0 1px #000;
      position: relative;
    }
    /* subtle plastic speckle */
    .cabinet::before {
      content: ""; position: absolute; inset: 0; border-radius: 26px; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 4px 4px; opacity: .5;
    }

    .screen-wrap {
      border-radius: 18px;
      padding: 14px;
      background: linear-gradient(180deg, #0a0a0d, #050507);
      box-shadow:
        inset 0 0 0 2px #2c2c34,
        inset 0 6px 16px rgba(0,0,0,.9),
        inset 0 -2px 6px rgba(255,255,255,.04);
    }

    .screen {
      position: relative;
      width: 100%; aspect-ratio: 4 / 3;
      border-radius: 16px / 22px;            /* slight CRT bulge */
      overflow: hidden;
      background: #04040a;
      box-shadow:
        inset 0 0 60px 12px rgba(0,0,0,.9),  /* corner darkening (tube vignette) */
        inset 0 0 0 2px rgba(0,0,0,.8),
        0 0 24px rgba(88,224,138,.10);        /* faint screen glow */
    }

    /* the actual game stream */
    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: fill;                       /* stretch 640x240 -> 4:3 (N64 display) */
      background: transparent;                /* show standby behind when not playing */
      transform: scale(1.015);                /* fake the tube curvature: bow past edges */
      filter: saturate(1.22) contrast(1.07) brightness(1.05);
      z-index: 2;
    }

    /* standby card (visible until a stream is playing) */
    .standby {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; color: #4a5a52;
      letter-spacing: 3px; font-size: 13px;
      text-shadow: 0 0 8px rgba(88,224,138,.25);
      transition: opacity .35s ease;
    }
    .standby b { color: var(--accent); font-size: 22px; letter-spacing: 6px; }
    .tv.on .standby { opacity: 0; }

    /* CRT effect layers (never block clicks) */
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .scanlines {
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px);
      mix-blend-mode: multiply; opacity: .8;
      animation: flicker 5.5s steps(60) infinite;
    }
    .mask {
      background: repeating-linear-gradient(
        to right,
        rgba(255,0,0,.05) 0 1px, rgba(0,255,0,.05) 1px 2px, rgba(0,0,255,.05) 2px 3px);
      mix-blend-mode: screen; opacity: .35;
    }
    .vignette {
      background: radial-gradient(120% 120% at 50% 50%,
        transparent 55%, rgba(0,0,0,.35) 85%, rgba(0,0,0,.7) 100%);
    }
    .glare {
      background: radial-gradient(60% 40% at 26% 16%, rgba(255,255,255,.10), transparent 60%);
      z-index: 4;
    }
    .roll { z-index: 4; opacity: .06; }
    .roll::before {
      content: ""; position: absolute; left: 0; right: 0; height: 22%;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.9), transparent);
      animation: roll 7s linear infinite;
    }
    .tv.on .screen { animation: turnon .55s ease-out; }

    @keyframes flicker { 0%,100%{opacity:.8} 48%{opacity:.74} 50%{opacity:.86} 52%{opacity:.78} }
    @keyframes roll { 0%{top:-25%} 100%{top:125%} }
    @keyframes turnon {
      0%   { filter: brightness(6) saturate(0); transform: scaleY(.004); }
      45%  { filter: brightness(2); transform: scaleY(1); }
      100% { filter: none; }
    }

    /* ---------------- control panel ---------------- */
    .panel {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; margin-top: 16px; padding: 0 6px;
    }
    .brand {
      font-weight: 800; letter-spacing: 2px; font-size: 15px; color: #c8c8d2;
      text-shadow: 0 1px 0 rgba(0,0,0,.8);
    }
    .brand span { color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 16px; }

    .power {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(180deg, #2b2b33, #17171c);
      color: #e8e8f0; border: 1px solid #000; border-radius: 999px;
      padding: 10px 20px; font: inherit; font-weight: 700; letter-spacing: 1px; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.5);
      transition: transform .06s, box-shadow .2s, color .2s;
    }
    .power:hover { color: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 0 16px rgba(88,224,138,.35); }
    .power:active { transform: translateY(1px); }
    .power:disabled { color: #6a6a78; cursor: default; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }

    .readout { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; color: #9a9aab; }
    #status::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; margin-right: 7px; vertical-align: -1px;
      background: #c9913f; box-shadow: 0 0 8px #c9913f; transition: all .2s;
    }
    #status.ok::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    #status.err::before { background: #f1879b; box-shadow: 0 0 10px #f1879b; }
    #status.ok { color: var(--accent); }
    #status.err { color: #f1879b; }

    .knobs { display: flex; gap: 12px; }
    .knobs i {
      width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a4a54, #1a1a1f 70%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.6);
      position: relative;
    }
    .knobs i::after {
      content: ""; position: absolute; left: 50%; top: 3px; width: 2px; height: 7px;
      background: #7d7d88; transform: translateX(-50%); border-radius: 2px;
    }

    /* little stand/feet */
    .stand { width: 36%; height: 16px; margin-top: -2px;
      background: linear-gradient(180deg, #15151a, #0a0a0e);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 18px 30px -16px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05); }

    /* caption + controls hint */
    .caption { font-size: 13px; color: #8a8aa0; text-align: center; }
    .caption b { color: #cfcfe0; }
    .hint { color: #7c7c90; font-size: 12px; max-width: var(--w); text-align: center; margin: 0; }
    kbd {
      background: #15151b; border: 1px solid #2c2c3a; border-bottom-width: 2px;
      border-radius: 4px; padding: 1px 6px; color: #cfcfe6; font-size: 11px;
    }

    @media (prefers-reduced-motion: reduce) {
      .scanlines, .roll::before, .tv.on .screen { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="tv">
    <div class="cabinet">
      <div class="screen-wrap">
        <div class="screen">
          <video id="video" autoplay playsinline></video>
          <div class="standby"><b>SMASH·O·VISION</b><span>NO SIGNAL — press POWER</span></div>
          <div class="fx mask"></div>
          <div class="fx scanlines"></div>
          <div class="fx vignette"></div>
          <div class="fx glare"></div>
          <div class="fx roll"></div>
        </div>
      </div>
      <div class="panel">
        <div class="brand">SMASH·O·VISION <span>64</span></div>
        <div class="controls">
          <button id="connect" class="power">⏻ <span>POWER</span></button>
          <span class="readout"><span id="status">standby</span></span>
        </div>
        <div class="knobs"><i></i><i></i></div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <p class="caption"><b>Super Smash Bros. 64</b> · emulación 100% en el servidor, streaming por WebRTC</p>
  <p class="hint">
    <b>Stick:</b> <kbd>←↑↓→</kbd> · <b>A</b> <kbd>X</kbd> · <b>B</b> <kbd>Z</kbd> ·
    <b>Z-trig</b> <kbd>C</kbd> · <b>L</b> <kbd>Q</kbd> · <b>R</b> <kbd>E</kbd> · <b>Start</b> <kbd>Enter</kbd>
    · <b>C</b> <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>
  </p>

  <script>
    // Physical-key (e.code) -> { player, N64 wire button }. The server folds the
    // Stick*/C* names into the analog control stick / C-stick; the rest are digital.
    const KEYMAP = {
      // control stick (analog) on the arrows
      ArrowUp:    { p: 1, b: "StickUp" },
      ArrowDown:  { p: 1, b: "StickDown" },
      ArrowLeft:  { p: 1, b: "StickLeft" },
      ArrowRight: { p: 1, b: "StickRight" },
      // face / shoulder / start
      KeyX:  { p: 1, b: "A" },
      KeyZ:  { p: 1, b: "B" },
      KeyC:  { p: 1, b: "Z" },      // N64 Z trigger
      KeyQ:  { p: 1, b: "L" },
      KeyE:  { p: 1, b: "R" },
      Enter: { p: 1, b: "Start" },
      // C-buttons on IJKL (up/left/down/right)
      KeyI:  { p: 1, b: "CUp" },
      KeyJ:  { p: 1, b: "CLeft" },
      KeyK:  { p: 1, b: "CDown" },
      KeyL:  { p: 1, b: "CRight" },
    };

    const statusEl = document.getElementById("status");
    const video = document.getElementById("video");
    const connectBtn = document.getElementById("connect");
    let pc, inputChannel;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    connectBtn.onclick = connect;

    async function connect() {
      connectBtn.disabled = true;
      setStatus("connecting…");
      // Empty iceServers: localhost host candidates only -> instant, no network.
      pc = new RTCPeerConnection({ iceServers: [] });
      window.pc = pc; // debug/testing hook (getStats)

      // We only receive media; recvonly transceivers give the server m-lines to answer.
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });

      const remote = new MediaStream();
      video.srcObject = remote;
      pc.ontrack = (e) => remote.addTrack(e.track);

      pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        if (s === "connected" || s === "completed") setStatus("connected · playing", "ok");
        else if (s === "failed" || s === "disconnected") setStatus("ice: " + s, "err");
        else setStatus("ice: " + s);
      };

      // Browser creates the input channel; server reacts via on_data_channel.
      inputChannel = pc.createDataChannel("input", { ordered: true });

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGatheringComplete(pc); // non-trickle: POST a complete offer

      try {
        const resp = await fetch("/offer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
        });
        if (!resp.ok) throw new Error("server " + resp.status + ": " + (await resp.text()));
        const answer = await resp.json(); // { sdp, type:"answer" }
        await pc.setRemoteDescription(answer);
        video.focus();
      } catch (err) {
        setStatus("error: " + err.message, "err");
        connectBtn.disabled = false;
      }
    }

    function waitIceGatheringComplete(pc) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        };
        pc.addEventListener("icegatheringstatechange", check);
        // Safety timeout in case the "complete" event is missed.
        setTimeout(resolve, 1500);
      });
    }

    // Capture keys; de-dupe key-repeat with a Set; send {type, button} as JSON.
    const pressed = new Set();
    function sendInput(kind, button, player) {
      if (inputChannel && inputChannel.readyState === "open") {
        inputChannel.send(JSON.stringify({ type: kind, button, player }));
      }
    }
    window.addEventListener("keydown", (e) => {
      const m = KEYMAP[e.code];
      if (!m) return;
      e.preventDefault();
      if (pressed.has(e.code)) return;
      pressed.add(e.code);
      sendInput("down", m.b, m.p);
    });
    window.addEventListener("keyup", (e) => {
      const m = KEYMAP[e.code];
      if (!m) return;
      e.preventDefault();
      pressed.delete(e.code);
      sendInput("up", m.b, m.p);
    });

    // --- CRT "power on" flair (additive; does not touch the logic above) ---
    const tv = document.querySelector(".tv");
    video.addEventListener("playing", () => tv.classList.add("on"));
    video.addEventListener("emptied", () => tv.classList.remove("on"));
  </script>
</body>
</html>
