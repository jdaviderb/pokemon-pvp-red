<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RETRO·VISION — Login</title>
  <style>
    :root { --bg:#0a0a0f; --panel:#14141c; --accent:#46e07f; --txt:#e8e8f0; --dim:#8a8aa0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:
      radial-gradient(1200px 600px at 50% -10%, #1a1a2a 0%, var(--bg) 60%); color:var(--txt);
      font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .card { width:min(92vw,380px); background:var(--panel); border:1px solid #262633;
      border-radius:16px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    h1 { margin:0 0 4px; font-size:20px; letter-spacing:1px; }
    h1 b { color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--dim); font-size:12px; }
    label { display:block; font-size:11px; color:var(--dim); margin:14px 0 6px; letter-spacing:.5px; }
    input { width:100%; padding:11px 12px; background:#0e0e15; border:1px solid #2a2a38;
      border-radius:9px; color:var(--txt); font:inherit; font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    .row { display:flex; gap:10px; margin-top:22px; }
    button { flex:1; padding:12px; border-radius:9px; border:1px solid #2a2a38; background:#1c1c28;
      color:var(--txt); font:inherit; font-weight:700; cursor:pointer; transition:.15s; }
    button.primary { background:var(--accent); color:#06120a; border-color:var(--accent); }
    button:hover { filter:brightness(1.1); }
    .msg { margin-top:16px; min-height:18px; font-size:12px; color:#f1879b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RETRO·VISION <b>ARENA</b></h1>
    <p class="sub">2-player Pokémon battles · server-side · WebRTC</p>
    <label for="u">USERNAME</label>
    <input id="u" autocomplete="username" maxlength="20" placeholder="ash" />
    <label for="p">PASSWORD</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••" />
    <div class="row">
      <button class="primary" id="login">Login</button>
      <button id="register">Register</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.style.color = ok ? "#46e07f" : "#f1879b"; };
    async function go(path) {
      const username = $("u").value.trim(), password = $("p").value;
      if (username.length < 3) return msg("❌ username needs at least 3 characters");
      if (password.length < 6) return msg("❌ password needs at least 6 characters (you typed " + password.length + ")");
      msg("…", true);
      try {
        const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ username, password }) });
        if (r.ok) { location.href = "/"; return; }
        msg((await r.text()) || ("HTTP " + r.status));
      } catch (e) { msg("network error"); }
    }
    $("login").onclick = () => go("/auth/login");
    $("register").onclick = () => go("/auth/register");
    $("p").addEventListener("keydown", (e) => { if (e.key === "Enter") go("/auth/login"); });
  </script>
</body>
</html>
