<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED STADIUM ENGINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#04070a; --grn:#5ad17a; --grn-dim:#2c6e44; --red:#e8403f; --wht:#e9efe6; --txt:#9fe0b4; --dim:#4f8a66; --line:#1c3a28; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
      font-family:"VT323", ui-monospace, monospace; font-size:22px;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden; }
    .corner { position:absolute; padding:8px 14px; border:2px solid var(--line); border-radius:6px; background:#070d0a; font-size:18px; color:var(--dim); line-height:1.25; }
    .corner b { color:var(--grn); font-size:20px; } .corner .led { color:var(--red); }
    .tl{top:18px;left:18px;} .tr{top:18px;right:18px;text-align:right;}
    .bl{bottom:18px;left:18px;} .br{bottom:18px;right:18px;}
    .bc{bottom:18px;left:50%;transform:translateX(-50%);text-align:center;}
    .stage { text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .balls { display:flex; align-items:center; gap:26px; }
    .pball { width:30px; height:30px; border-radius:50%; background:linear-gradient(#e8403f 0 47%, #111 47% 53%, #e9efe6 53% 100%);
      border:2px solid #0a0a0a; position:relative; box-shadow:0 0 14px rgba(232,64,63,.4); }
    .pball::after { content:""; position:absolute; inset:0; margin:auto; width:8px; height:8px; background:#e9efe6; border:2px solid #0a0a0a; border-radius:50%; }
    .logo { font-family:"Press Start 2P", monospace; line-height:1.06; margin:6px 0; }
    .logo .red { color:var(--red); font-size:58px; text-shadow:4px 4px 0 #5a0f0e, 0 0 22px rgba(232,64,63,.5); display:block; }
    .logo .wht { color:var(--wht); font-size:48px; text-shadow:4px 4px 0 #555, 0 0 10px rgba(255,255,255,.25); display:block; margin:6px 0; letter-spacing:2px; }
    .logo .eng { color:var(--red); font-size:30px; text-shadow:3px 3px 0 #5a0f0e; display:block; }
    .sub { color:var(--grn); letter-spacing:3px; font-size:22px; margin-top:4px; }
    .panel { margin-top:22px; border:3px solid var(--grn-dim); border-radius:10px; background:#060f0a;
      padding:16px 26px; min-width:min(86vw,480px); box-shadow:0 0 24px rgba(90,209,122,.12) inset; }
    .press { font-family:"Press Start 2P", monospace; font-size:24px; color:var(--grn); letter-spacing:2px;
      display:flex; align-items:center; justify-content:center; gap:18px; cursor:pointer; padding:8px; }
    .press .pball { width:22px; height:22px; } .press.blink { animation:bk 1s steps(2) infinite; }
    @keyframes bk { 50% { opacity:.35; } }
    .arrow { color:var(--grn); font-size:20px; margin-top:8px; }
    /* login form (revealed) */
    .form { display:none; }
    .form.on { display:block; }
    label { display:block; text-align:left; color:var(--dim); font-size:18px; letter-spacing:2px; margin:10px 0 4px; }
    input { width:100%; background:#04100a; border:2px solid var(--line); border-radius:6px; color:var(--wht);
      font-family:inherit; font-size:22px; padding:8px 12px; }
    input:focus { outline:none; border-color:var(--grn); }
    .row { display:flex; gap:12px; margin-top:16px; }
    .btn { flex:1; font-family:"Press Start 2P", monospace; font-size:13px; padding:13px; border-radius:7px; cursor:pointer;
      background:#0c1a12; color:var(--txt); border:2px solid var(--grn-dim); letter-spacing:1px; }
    .btn.primary { background:var(--grn); color:#06120a; border-color:var(--grn); }
    .btn:hover { filter:brightness(1.12); }
    .msg { margin-top:12px; min-height:20px; font-size:20px; color:var(--red); }
  </style>
</head>
<body>
  <div class="corner tl"><span class="led">▪</span> SEED<br><b id="seed">BATTLE_0042</b></div>
  <div class="corner tr"><span class="led">▪</span> MODE<br><b>1 VS 1</b><br>LEVEL CAP: 50</div>

  <div class="stage">
    <div class="balls"><span class="pball"></span>
      <div class="logo"><span class="red">RED</span><span class="wht">STADIUM</span><span class="eng">ENGINE</span></div>
      <span class="pball"></span>
    </div>
    <div class="sub">◂─── RANDOM BATTLE ARENA ───▸</div>

    <div class="panel">
      <div class="press blink" id="press"><span class="pball"></span> PRESS START <span class="pball"></span></div>
      <div class="form" id="form">
        <label>USERNAME</label>
        <input id="u" autocomplete="username" maxlength="20" placeholder="ASH" />
        <label>PASSWORD</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="••••••" />
        <div class="row">
          <button class="btn primary" id="login">LOGIN</button>
          <button class="btn" id="register">REGISTER</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
    <div class="arrow" id="arrow">▾</div>
  </div>

  <div class="corner bl">BUILD 1.0.0</div>
  <div class="corner bc"><span class="led">▪</span> PREPARE. COMPETE. BE LEGEND. <span class="led">▪</span></div>
  <div class="corner br">© 2025 RSE</div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.style.color = ok ? "#5ad17a" : "#e8403f"; };
    // already logged in? skip the title screen
    (async () => { try { const r = await fetch("/api/me"); if (r.ok) location.replace("/"); } catch (e) {} })();

    function start() {
      $("press").style.display = "none"; $("arrow").style.display = "none";
      $("form").classList.add("on"); $("u").focus();
    }
    $("press").onclick = start;
    document.addEventListener("keydown", (e) => { if (!$("form").classList.contains("on") && (e.key === "Enter" || e.key === " ")) start(); });

    async function go(path) {
      const username = $("u").value.trim(), password = $("p").value;
      if (username.length < 3) return msg("USERNAME NEEDS 3+ CHARACTERS");
      if (password.length < 6) return msg("PASSWORD NEEDS 6+ CHARACTERS (YOU TYPED " + password.length + ")");
      msg("…", true);
      try {
        const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
        if (r.ok) { location.href = "/"; return; }
        if (path === "/auth/register" && r.status === 409) return go("/auth/login");
        msg((await r.text()).toUpperCase() || ("HTTP " + r.status));
      } catch (e) { msg("NETWORK ERROR"); }
    }
    $("login").onclick = () => go("/auth/login");
    $("register").onclick = () => go("/auth/register");
    $("p").addEventListener("keydown", (e) => { if (e.key === "Enter") go("/auth/login"); });
  </script>
</body>
</html>
