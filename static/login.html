<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED STADIUM ENGINE</title>
  <style>
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }
    :root { --bg:#e9e7dd; --red:#e8403f; --parch:#ffffff; --field:#f0f0f0; --ink:#000000; --inkdim:#666; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:"PokeRed", ui-monospace, "Courier New", monospace; font-size:16px; -webkit-font-smoothing:none; font-smooth:never;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; }
    .gb { background:var(--parch); color:var(--ink); position:relative; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; }
    .gb::after { content:none; }
    .corner { position:absolute; padding:7px 14px; font-size:16px; color:var(--inkdim); line-height:1.3; }
    .corner b { color:var(--ink); font-size:18px; display:block; }
    .tl{top:16px;left:16px;} .tr{top:16px;right:16px;text-align:right;}
    .foot { position:absolute; bottom:18px; width:100%; left:0; display:flex; justify-content:space-between; padding:0 22px; color:#7c7c68; font-size:16px; letter-spacing:1px; }
    .stage { text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; z-index:1; }
    /* Pokemon Red intro parade: a grayscale mon scrolls across the lower screen, changing each pass */
    .parade { position:fixed; left:0; right:0; bottom:0; height:60%; overflow:hidden; z-index:0; pointer-events:none; }
    .parade img { position:absolute; bottom:-6%; left:0; height:min(48vh,320px); image-rendering:pixelated;
      filter:grayscale(1) contrast(1.12) brightness(.5); opacity:.5; animation:parade 5s linear infinite; }
    .parade img.b { animation-delay:-2.5s; }
    @keyframes parade { from { transform:translateX(-34vw); } to { transform:translateX(132vw); } }
    .balls { display:flex; align-items:center; gap:24px; }
    .pball { width:28px; height:28px; border-radius:50%; background:linear-gradient(#666 0 47%,#111 47% 53%,#fff 53% 100%); border:2px solid #0a0a0a; position:relative; }
    .pball::after { content:""; position:absolute; inset:0; margin:auto; width:8px; height:8px; background:#e9efe6; border:2px solid #0a0a0a; border-radius:50%; }
    .logo { font-family:"PokeRed", monospace; color:#8a8a8a; font-size:40px; letter-spacing:2px; line-height:1.2; image-rendering:pixelated;
      text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000, 5px 5px 0 #555; }
    .sub { color:#9a9a86; letter-spacing:4px; font-size:16px; margin-top:4px; }
    .panel { margin-top:22px; padding:16px 24px; min-width:min(86vw,460px); }
    .press { font-family:"PokeRed", monospace; font-size:24px; color:var(--ink); letter-spacing:2px;
      display:flex; align-items:center; justify-content:center; gap:16px; cursor:pointer; padding:10px; }
    .press .pball { width:18px; height:18px; } .press.blink { animation:bk 1s steps(2) infinite; }
    @keyframes bk { 50% { opacity:.45; } }
    .arrow { color:var(--ink); font-size:20px; margin-top:8px; }
    /* social login buttons (Google now; more later) */
    .provbtn { display:flex; align-items:center; justify-content:center; gap:12px; position:relative;
      font-family:"PokeRed", monospace; font-size:21px; color:var(--ink); text-decoration:none;
      padding:14px 18px; cursor:pointer; letter-spacing:1px; border:3px solid var(--ink); border-radius:6px; background:var(--field); }
    .provbtn + .provbtn { margin-top:10px; }
    .provbtn:hover { filter:brightness(.96); }
    .provbtn .cur { color:var(--ink); }
    .form { display:none; } .form.on { display:block; }
    label { display:block; text-align:left; color:var(--inkdim); font-size:16px; letter-spacing:2px; margin:10px 0 4px; }
    input { width:100%; background:var(--field); border:3px solid var(--ink); border-radius:6px; color:var(--ink);
      font-family:inherit; font-size:22px; padding:7px 12px; }
    input:focus { outline:none; box-shadow:0 0 0 2px var(--ink) inset; }
    /* Pokemon-style menu (left-aligned items + ▶ cursor) */
    .menu { margin-top:18px; }
    .mitem { position:relative; text-align:left; padding:6px 8px 6px 34px; font-size:22px; cursor:pointer; line-height:1.5; }
    .mitem .cur { position:absolute; left:8px; opacity:0; }
    .mitem:first-child .cur { opacity:1; }
    .menu:hover .mitem:first-child .cur { opacity:0; }
    .mitem:hover .cur { opacity:1; }
    .msg { margin-top:12px; min-height:20px; font-size:18px; color:#333; }
    /* real Pokemon Red title assets (from pret/pokered gfx/title) */
    .logo-img { width:min(76vw,520px); height:auto; image-rendering:pixelated; }
    .verrow { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:6px; }
    .ver-txt { font-family:"PokeRed", monospace; font-size:26px; color:#000; letter-spacing:2px; image-rendering:pixelated; white-space:nowrap; }
    .red-img { width:min(13vw,76px); height:auto; image-rendering:pixelated; }
  </style>
</head>
<body>
  <div class="parade"><img id="paradeMon" src="/sprites/94.png" alt="" /><img id="paradeMon2" class="b" src="/sprites/6.png" alt="" /></div>
  <div class="gb corner tr">MODE<b>1 VS 1</b>LEVEL CAP: 50</div>

  <div class="stage">
    <img class="logo-img" src="/title/pokemon_logo.png" alt="POKEMON" />
    <div class="verrow">
      <span class="ver-txt">Red PVP MOD</span>
      <img class="red-img" src="/title/player.png" alt="" />
    </div>

    <div class="gb panel">
      <div id="providers"></div>
      <div id="devauth" style="display:none">
        <div class="press blink" id="press"><span class="pball"></span> PRESS START <span class="pball"></span></div>
        <div class="form" id="form">
          <label>USERNAME</label>
          <input id="u" autocomplete="username" maxlength="20" placeholder="ASH" />
          <label>PASSWORD</label>
          <input id="p" type="password" autocomplete="current-password" placeholder="••••••" />
          <div class="menu">
            <div class="mitem" id="login"><span class="cur">▶</span>LOGIN</div>
            <div class="mitem" id="register"><span class="cur">▶</span>REGISTER</div>
          </div>
          <div class="msg" id="msg"></div>
        </div>
      </div>
      <div id="nologin" class="msg" style="display:none">- LOGIN NOT CONFIGURED -</div>
    </div>
    <div class="arrow" id="arrow" style="display:none">▾</div>
  </div>

  <div class="foot"><span>PLAYERS ONLINE: <b id="online">--</b></span><span>PREPARE. COMPETE. BE LEGEND.</span><span></span></div>

  <script>
    const $ = (id) => document.getElementById(id);
    // Live "players online": heartbeat + count (anyone with a page open counts).
    const _cid = "t" + Math.random().toString(36).slice(2);
    async function pollOnline() {
      try { const r = await fetch("/api/online?id=" + _cid); if (r.ok) $("online").textContent = (await r.json()).online; } catch (e) {}
    }
    pollOnline(); setInterval(pollOnline, 4000);
    // Intro parade: two staggered mons cross continuously, each swapping to a new random Gen-1
    // sprite at the start of every pass (the changing-Pokemon title animation).
    (() => {
      const pick = () => "/sprites/" + (Math.floor(Math.random() * 151) + 1) + ".png";
      ["paradeMon", "paradeMon2"].forEach((id) => {
        const mon = $(id); if (!mon) return;
        mon.src = pick();
        mon.addEventListener("animationiteration", () => (mon.src = pick()));
      });
    })();
    const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.style.color = ok ? "#2c6e44" : "#9a2c2c"; };
    (async () => { try { const r = await fetch("/api/me"); if (r.ok) location.replace("/"); } catch (e) {} })();
    // Login options from the server: social providers always; username/password only in DEV mode.
    let USERNAME_LOGIN = false;
    const PROV_LABEL = { google: "SIGN IN WITH GOOGLE", twitter: "SIGN IN WITH X", apple: "SIGN IN WITH APPLE", github: "SIGN IN WITH GITHUB" };
    (async () => {
      let cfg = { providers: [], username_login: false, guest: false };
      try { cfg = await (await fetch("/api/config")).json(); } catch (e) {}
      USERNAME_LOGIN = !!cfg.username_login;
      const box = $("providers");
      (cfg.providers || []).forEach((p) => {
        const a = document.createElement("a");
        a.className = "provbtn"; a.href = "/auth/oauth/" + p;
        a.innerHTML = '<span class="cur">▶</span>' + (PROV_LABEL[p] || ("SIGN IN WITH " + p.toUpperCase()));
        box.appendChild(a);
      });
      if (cfg.guest) {
        const g = document.createElement("button");
        g.className = "provbtn"; g.type = "button";
        g.innerHTML = '<span class="cur">▶</span>PLAY AS GUEST';
        g.onclick = guestLogin;
        box.appendChild(g);
      }
      if (USERNAME_LOGIN) { $("devauth").style.display = ""; $("arrow").style.display = ""; }
      if (!(cfg.providers || []).length && !cfg.guest && !USERNAME_LOGIN) $("nologin").style.display = "";
    })();
    function showErr(t) { const n = $("nologin"); n.textContent = t; n.style.display = ""; n.style.color = "#9a2c2c"; }
    async function guestLogin() {
      try {
        const r = await fetch("/auth/guest", { method: "POST" });
        if (r.ok) { location.href = "/"; return; }
        showErr((await r.text()).toUpperCase() || ("HTTP " + r.status));
      } catch (e) { showErr("NETWORK ERROR"); }
    }
    function start() { $("press").style.display = "none"; $("arrow").style.display = "none"; $("form").classList.add("on"); $("u").focus(); }
    $("press").onclick = start;
    document.addEventListener("keydown", (e) => { if (USERNAME_LOGIN && !$("form").classList.contains("on") && (e.key === "Enter" || e.key === " ")) start(); });
    async function go(path) {
      const username = $("u").value.trim(), password = $("p").value;
      if (username.length < 3) return msg("USERNAME NEEDS 3+ CHARACTERS");
      if (password.length < 6) return msg("PASSWORD NEEDS 6+ CHARACTERS (YOU TYPED " + password.length + ")");
      msg("...", true);
      try {
        const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
        if (r.ok) { location.href = "/"; return; }
        if (path === "/auth/register" && r.status === 409) return go("/auth/login");
        msg((await r.text()).toUpperCase() || ("HTTP " + r.status));
      } catch (e) { msg("NETWORK ERROR"); }
    }
    $("login").onclick = () => go("/auth/login");
    $("register").onclick = () => go("/auth/register");
    $("p").addEventListener("keydown", (e) => { if (e.key === "Enter") go("/auth/login"); });
  </script>
</body>
</html>
