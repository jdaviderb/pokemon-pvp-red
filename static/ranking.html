<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon PVP Red — Leaderboard (Today / Weekly / Monthly)</title>
  <meta name="description" content="The Pokémon PVP Red leaderboard. Win real-time Gen-1 online Pokémon battles to climb Today, Weekly and Monthly. Play Pokémon Red in your browser — free, no install, in color. Find a match, battle a real opponent, become #1." />
  <meta name="keywords" content="pokemon pvp, pokemon red online, pokemon red pvp, play pokemon red in browser, online pokemon battles, pokemon multiplayer, gen 1 pokemon pvp, retro pokemon arena, pokemon battle online free, pokemon leaderboard" />
  <meta name="theme-color" content="#b5302a" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pokemonpvp.red" />
  <meta property="og:title" content="Pokémon PVP Red — Climb the Leaderboard" />
  <meta property="og:description" content="Real opponents. Real-time Gen-1 battles. Win to rule Today, Weekly and Monthly. Play Pokémon Red online in your browser, free — no install, in color." />
  <meta property="og:image" content="/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pokémon PVP Red — Climb the Leaderboard" />
  <meta name="twitter:description" content="Real opponents. Real-time Gen-1 battles. Win to top Today, Weekly and Monthly. Play Pokémon Red online in your browser, free." />
  <meta name="twitter:image" content="/og.png" />
  <script src="/gbfx.js"></script>
  <style>
    @font-face { font-family:"PokeRed"; src:url("/fonts/pokered.woff2") format("woff2"), url("/fonts/pokered.ttf") format("truetype"); font-display:swap; }
    :root { --bg:#e9e7dd; --ink:#000; --inkdim:#666; --red:#b5302a; --field:#f0f0f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:"PokeRed", ui-monospace, "Courier New", monospace; -webkit-font-smoothing:none;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px);
      display:flex; flex-direction:column; align-items:center; padding:18px 14px 40px; gap:12px; }
    .head { display:flex; align-items:center; gap:16px; }
    .logo-img { width:min(30vw,170px); height:auto; image-rendering:pixelated; }
    .title { font-size:26px; letter-spacing:5px; } .sub { color:var(--inkdim); font-size:13px; letter-spacing:2px; }
    .tabs { display:flex; gap:8px; }
    .tab { font-family:"PokeRed", monospace; font-size:19px; letter-spacing:2px; padding:9px 18px; cursor:pointer;
      border:3px solid var(--ink); border-radius:6px; background:var(--field); color:var(--ink); }
    .tab.on { background:var(--ink); color:#fff; }
    .board { width:100%; max-width:560px; background:#fff; border:14px solid transparent;
      border-image:url("/gb-frame.png") 7 fill / 14px / 0 stretch; image-rendering:pixelated; padding:8px 6px; }
    .row { display:grid; grid-template-columns:54px 1fr auto; align-items:center; gap:10px;
      padding:9px 12px; font-size:19px; letter-spacing:1px; border-bottom:2px dashed #cfcabb; }
    .row:last-child { border-bottom:0; }
    .row .rk { color:var(--inkdim); text-align:center; }
    .row.top1 .rk, .row.top1 .nm { color:var(--red); }
    .row .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .wn { font-variant-numeric:tabular-nums; }
    .hdr { display:grid; grid-template-columns:54px 1fr auto; gap:10px; padding:4px 12px 10px; color:var(--inkdim); font-size:14px; letter-spacing:2px; }
    .empty { text-align:center; color:var(--inkdim); padding:34px 10px; font-size:18px; line-height:1.6; }
    .foot { color:var(--inkdim); font-size:13px; letter-spacing:1px; }
    .links { font-size:18px; color:#7c7c68; } .links a { color:#7c7c68; text-decoration:none; } .links a:hover { color:var(--ink); }
  </style>
</head>
<body>
  <div class="head"><img class="logo-img" src="/title/pokemon_logo.png" alt="Pokémon PVP Red" /><div><div class="title">LEADERBOARD</div><div class="sub">- POKéMON PVP RED · TOP TRAINERS -</div></div></div>
  <div class="tabs">
    <div class="tab on" data-w="today">TODAY</div>
    <div class="tab" data-w="weekly">WEEKLY</div>
    <div class="tab" data-w="monthly">MONTHLY</div>
  </div>
  <div class="board">
    <div class="hdr"><span>RANK</span><span>TRAINER</span><span>WINS</span></div>
    <div id="rows"><div class="empty">Loading the champions…</div></div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="links"><a href="/lobby">‹ BACK TO ARENA</a></div>
  <script>
    const $ = (id) => document.getElementById(id);
    let DATA = { today: [], weekly: [], monthly: [], updated: null };
    let win = "today";

    function render() {
      const list = DATA[win] || [];
      if (!list.length) { $("rows").innerHTML = '<div class="empty">No battles won in this period yet.<br>Be the first!</div>'; return; }
      $("rows").innerHTML = list.map((e, i) =>
        '<div class="row' + (i === 0 ? ' top1' : '') + '">' +
        '<span class="rk">' + (i + 1) + '</span>' +
        '<span class="nm">' + (e.name || "?").toUpperCase() + '</span>' +
        '<span class="wn">' + e.wins + '</span></div>'
      ).join("");
    }
    function setTab(w) {
      win = w;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.w === w));
      render();
    }
    document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => setTab(t.dataset.w)));

    async function load() {
      try {
        DATA = await (await fetch("/api/ranking")).json();
        render();
        if (DATA.updated) {
          const secs = Math.max(0, Math.round((Date.now() - new Date(DATA.updated).getTime()) / 1000));
          $("foot").textContent = "Updated " + (secs < 90 ? secs + "s" : Math.round(secs / 60) + "m") + " ago - refreshes every few minutes";
        }
      } catch (e) { $("rows").innerHTML = '<div class="empty">Could not load the ranking.</div>'; }
    }
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
